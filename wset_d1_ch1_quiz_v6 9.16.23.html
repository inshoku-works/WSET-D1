 opts:['大量の収穫を素早く行うこと','二次果房（second crop）と主果房を分けること','未熟果と熟果を選り分けること','夜間に収穫すること','コストを下げること'],
 ans:[1,2],exp:`機械収穫では"the second crop cannot be separated"（二次果房を分離できない）。また未熟果と熟果の選り分け（selective picking）も困難。これが品質上の主な制約。<div class='mnemonic'><div class='ml'>🧠 ポイント</div>手摘み→選別OK / グリーンハーベスト→事前除去OK / 機械収穫→分離不可 ✗</div><div class="page-ref">教科書 p.p.2–3 — Lateral Shoots</div>`},

// ========== 複合問題・発展問題 25問 ==========

// ─── 原因→結果の連鎖 ───
{type:'mc',cat:'複合・発展',
 q:'猛暑により土壌水分が激減した。気孔を閉じて水分を守ろうとするこの防衛反応が同時に引き起こす「望ましくない副作用」はどれか？',
 en:'During severe drought, stomata close to conserve water. What is the simultaneous unwanted side effect?',
 opts:['根からの水分吸収が完全に止まる','光合成が制限されて糖の蓄積が鈍る','果皮のタンニンが急増する','側枝（lateral shoot）が大量に発生する'],
 ans:1,
 exp:`気孔が閉じるとCO₂が入れなくなり光合成（photosynthesis）が制限される。糖の生産が落ちることで熟度の進行が遅れる。水を守るか成長を続けるかというトレードオフ。<div class="mnemonic"><div class="ml">🧠 連鎖</div>水不足 → 気孔閉鎖 → CO₂遮断 → 光合成↓ → 糖蓄積↓ → 熟度遅延</div>${p('3','Leaves')}`},

{type:'mc',cat:'複合・発展',
 q:'Pinot Noirの密着果房（tight bunch）とブルゴーニュで収穫時期の判断が特に繊細とされることの論理的な連鎖として最も正しいものは？',
 en:'What is the logical chain linking Pinot Noir tight bunches to critical harvest timing decisions in Burgundy?',
 opts:['密着果房は糖の蓄積が早いため過熟リスクが高い','密着果房は空気循環が悪く真菌病リスクが高いため、雨の前に素早く収穫する必要がある','密着果房は機械収穫に適さないため人件費が高騰する','密着果房は色素が薄くなるため収穫を早めて色を保護する必要がある'],
 ans:1,
 exp:`Pinot Noirの密着果房（tight bunch）は果皮が破れやすく通気も悪いため、真菌病（fungal disease）特にBotrytisのリスクが高い。ブルゴーニュのように秋に雨が多い地域では雨が来る前に素早く収穫するかどうかの判断が重要になる。<div class="mnemonic"><div class="ml">🧠 産地知識との接続</div>密着果房→真菌病リスク↑→収穫タイミングがシビア→ヴィンテージ差が大きい地域の一因</div>${p('3–4','Bunches')}`},

{type:'mc',cat:'複合・発展',
 q:'ステム（stem）にタンニンが含まれることを知っている醸造家が「全房発酵（whole bunch fermentation）」を選択する場合の主な狙いはどれか？',
 en:'A winemaker knowing the stem contains tannins chooses whole bunch fermentation. What is the main aim?',
 opts:['果汁の収量を増やすため','果梗のタンニンをワインに加えて構造と複雑性を与えるため','ブルームを溶け込ませてアロマを増幅させるため','種子の胚（embryo）からの風味を抽出するため'],
 ans:1,
 exp:`ステム（stem）にはタンニンが含まれる（p.4）。全房発酵（whole bunch fermentation）では果梗ごと発酵槽に入れることで、果梗由来のタンニンがワインに溶け出し構造（structure）や複雑性（complexity）を加える効果が期待される。ただし未熟な梗は青臭さの原因にもなる。<div class="mnemonic"><div class="ml">🧠 醸造との接続</div>stem → tannins → whole bunch → 構造と複雑性→ Burgundy, Rhôneで多用</div>${p('4','Grapes')}`},

{type:'mc',cat:'複合・発展',
 q:'テインチュリエ品種（teinturier variety）がブレンドに使われる主な醸造上の理由はどれか？',
 en:'What is the main winemaking reason for blending in a teinturier variety?',
 opts:['果肉まで赤いため果汁の段階から色素が豊富で、薄色ワインに深みを加えられる','タンニンが非常に少ないため軽やかなロゼに仕上げられる','糖度が特に高いためアルコール度数を上げられる','種子の油分が多くテクスチャーを豊かにできる'],
 ans:0,
 exp:`通常のブドウは果肉（pulp）が無色透明で色素は果皮（skin）のみに含まれる。テインチュリエ品種（例：Alicante Bouschet）は果肉も赤色で、果汁を絞った段階から赤い果汁が得られる。色が薄いと感じるワインに少量ブレンドして色を補正するために使われてきた歴史がある。${p('4','Grapes')}`},

// ─── 醸造との接続 ───
{type:'mc',cat:'複合・発展',
 q:'機械収穫を行うブドウ農家が二次果房（second crop）の問題を事前に防ぐ最も根本的な対策はどれか？',
 en:'What is the most fundamental preventive measure against second crop problems in machine-harvested vineyards?',
 opts:['収穫機のスピードを落として丁寧に収穫する','生育期中にグリーンハーベスト（green harvesting）で二次果房を除去しておく','早摘みして二次果房が熟す前に収穫する','黒ブドウの代わりに白ブドウを栽培する'],
 ans:1,
 exp:`機械収穫（machine harvesting）では一次果房と二次果房を分離することができない（p.3）。そのため最も根本的な対策は生育期中のgreen harvesting（グリーンハーベスト）で二次果房を事前除去すること。残った一次果房の熟度の均一性（uniformity of ripeness）も向上する。${p('2–3','Lateral Shoots')}`},

{type:'mc',cat:'複合・発展',
 q:'スパークリングワイン生産においてPinot Noir Clone 521がClone 115より好まれる理由を、果粒構造の知識と組み合わせて最も正しく説明したものはどれか？',
 en:'Why is Clone 521 preferred over Clone 115 for sparkling wine, combining knowledge of grape berry structure?',
 opts:['521は糖度が高くベースワインのアルコールが高くなるから','521は大粒・高収量で果皮/果肉比率が低く、タンニンと色素の少ない果汁が得られるから','521は密着果房のため真菌病に強く安定した品質が得られるから','521はブルームが多く酸化防止効果があるから'],
 ans:1,
 exp:`スパークリングワインでは果皮由来の高濃度タンニンや色素は必要ない。Clone 521は大粒・高収量で粒が大きいほど果肉（pulp）に対する果皮（skin）の比率が小さくなる（表面積/体積比↓）。その結果タンニンと色素の少ない「白い果汁」が得られやすい。<div class="mnemonic"><div class="ml">🧠 数学的直感</div>大きい球→表面積/体積比↓→果皮の影響が相対的に小さい→色素・タンニン少→スパークリング向き</div>${p('7','Clones')}`},

{type:'tf',cat:'複合・発展',
 q:'根（roots）が産生するホルモンはブドウの成長と果実の熟成に関与するため、台木の種類が異なると果実の熟度特性にも影響しうる。',
 en:'Root-produced hormones influence vine growth and fruit ripening, so different rootstocks may affect ripening characteristics.',
 ans:true,
 exp:`正解。根はホルモンを産生し（p.6）ブドウの成長と果実熟成に重要な機能を持つ。台木（rootstock）の種類は根の構造と代謝に影響するため、同じV. viniferaの穂木でも台木が異なれば熟成のタイミングや収量・果実の特性にまで影響しうる。これがPlanting Materialsの章で台木選択が重要視される理由の一つ。${p('6','Roots')}`},

// ─── 品種名・歴史の謎解き ───
{type:'mc',cat:'複合・発展',
 q:'「Cabernet Sauvignon」という名前の中に、両親の名前のかけらが隠されている。正しく対応しているのはどれか？',
 en:'The name "Cabernet Sauvignon" contains fragments of both parent variety names. Which pairing is correct?',
 opts:['「Cab」がCabernet Franc、「Sauv」がSauvignon Blanc','"Cabernet" + "Sauvignon" がそれぞれの親の名前そのもの','「Cab-ernet」がCabernet Franc、「Sauv-ignon」がSauvignon Blancに由来','名前は全く関係なく偶然の一致'],
 ans:2,
 exp:`Cabernet SauvignonはSauvignon Blanc × Cabernet Francの自然交差受粉から生まれた（p.9）。名前の中に両親の痕跡がある：<br>・「<b>Cab</b>ernet」← <b>Cab</b>ernet Franc<br>・「<b>Sauv</b>ignon」← <b>Sauv</b>ignon Blanc<br>品種名自体が親子関係を示している。<div class="mnemonic"><div class="ml">🧠 語呂</div>Cab.<b>Sauv</b>ignon←<b>Sauv</b>ignon Blanc / <b>Cab</b>ernet Sauv.←<b>Cab</b>ernet Franc</div>${p('9','New Grape Varieties')}`},

{type:'mc',cat:'複合・発展',
 q:'「Pinotage（ピノタージュ）」という名前の由来として正しいのはどれか？',
 en:'What is the correct origin of the name "Pinotage"?',
 opts:['南アフリカのピノタージュ村で発見されたから','Pinot（ピノ）+ Hermitage（エルミタージュ＝Cinsautの南アフリカでの旧称）を合成した名前','Pinoという醸造家とTageという研究者が共同開発したから','ピノ系品種の中で最もコクが強い意味のポルトガル語から'],
 ans:1,
 exp:`PinotageはPinot Noir × Cinsautのcross（クロス）（p.9）。名前は「<b>Pinot</b>」＋「Hermi<b>tage</b>」から来ている。HermitageはかつてCinsautの南アフリカでの別名として使われていた。品種名自体に交配の歴史が刻まれている。<div class="mnemonic"><div class="ml">🧠 語呂</div><b>Pinot</b>age ＝ <b>Pinot</b> Noir + Hermi<b>tage</b>（Cinsautの旧称）</div>${p('9','New Grape Varieties')}`},

{type:'mc',cat:'複合・発展',
 q:'フィロキセラ（phylloxera）の大流行（19世紀後半）がヨーロッパのブドウ栽培に与えた最も大きな構造的変化はどれか？',
 en:'What was the most significant structural change phylloxera brought to European viticulture in the late 19th century?',
 opts:['V. viniferaが絶滅してすべて北米種に置き換わった','V. viniferaを北米種の台木に接ぎ木する方式が世界標準になった','取り木（layering）が唯一の繁殖方法として普及した','テインチュリエ品種が急増して今も主流品種となっている'],
 ans:1,
 exp:`フィロキセラはV. viniferaの根に寄生して枯死させる害虫。V. viniferaは耐性を持たないが北米種は共進化によって耐性がある（p.1）。解決策として北米種を台木（rootstock）に使いV. viniferaを接ぎ木する方式が確立され、今日では世界のほぼすべての商業栽培がこの接ぎ木方式を採用している。<div class="mnemonic"><div class="ml">🧠 歴史の文脈</div>フィロキセラ禍 → 台木接ぎ木の標準化 → 台木選択が重要な栽培決定事項に</div>${p('1','The Vine / Rootstocks')}`},

{type:'mc',cat:'複合・発展',
 q:'チリが「自根（own-rooted）のV. vinifera」を広大な面積で栽培できている主な理由として最も適切なものはどれか？',
 en:'Why can Chile grow V. vinifera on its own roots (ungrafted) over large areas?',
 opts:['チリではフィロキセラが存在せず砂漠・山脈・海洋による自然の隔離がある','チリのV. viniferaは突然変異でフィロキセラ耐性を持つようになった','チリでは台木が非常に安価のためほぼすべてが接ぎ木','チリでは取り木（layering）が主流で台木が不要'],
 ans:0,
 exp:`チリはアンデス山脈・アタカマ砂漠・太平洋・南極の寒流という自然の障壁によってフィロキセラが侵入していない（または極めて限定的）。このためV. viniferaを自根で栽培できる世界でも稀な産地の一つ。教科書のp.1で「V. viniferaはフィロキセラ耐性なし・北米種は台木として使用」と学んだ知識の応用。${p('1','The Vine / Rootstocks')}`},

// ─── マーケティング・消費者心理 ───
{type:'mc',cat:'複合・発展',
 q:'マスセレクション（mass selection）が近年「マーケティング資産」として再評価されている理由として最も説得力があるものはどれか？',
 en:'Why is mass selection increasingly being revalued as a "marketing asset"?',
 opts:['マスセレクションは収量が安定して高く経済効率が良いから','同じ苗木業者のクローンを使う競合他社と差別化できる「独自の畑の歴史」を語れるから','マスセレクションの苗はウイルス検査済みで消費者の安心感につながるから','マスセレクションは生産コストが低く値下げできるから'],
 ans:1,
 exp:`教科書p.8は「the vineyard owner is using their own unique planting material...which can be used as a marketing asset」と明記。苗木業者から同じクローンを購入するワイナリーが増えるほど、独自の圃場材料を持つワイナリーは「うちの畑だけの樹」というストーリーを語れる希少性がマーケティング上の価値を持つ。テロワールの概念とも強く結びつく。${p('8','Mass Selection')}`},

{type:'mc',cat:'複合・発展',
 q:'「遺伝学の進歩で品種改良が加速したのに、新品種がほとんど市場に出ない」という逆説の最大の原因はどれか？',
 en:'Despite genetic advances speeding up breeding, new varieties rarely reach the market. What is the main reason?',
 opts:['OIVへの登録規制が厳しすぎて実質的にブロックされているから','消費者がCabernet SauvignonやChardonnayなど既知品種を好み新品種を試さないから','品種改良で作られた新品種はすべてV. viniferaに劣る品質だから','苗木業者が既存品種のクローン販売に利益があり新品種を扱いたがらないから'],
 ans:1,
 exp:`教科書は「still, new grape varieties rarely come to market; the main reason is <b>consumer resistance</b>」と明記（p.9）。科学者は遺伝マーカーで育種を加速できるようになったが、消費者は見慣れた品種名のワインを選ぶ傾向があり無名の新品種は手に取ってもらえない。技術的障壁ではなく心理的障壁が最大の壁。<div class="mnemonic"><div class="ml">🧠 面白いポイント</div>遺伝学の最先端でも勝てない相手は「消費者の惰性」。</div>${p('9','New Grape Varieties')}`},

{type:'tf',cat:'複合・発展',
 q:'「Selection Massale（マスセレクション）」をマーケティング用語として使って高い価格を設定するワイナリーがある。教科書によると、このマーケティングの根拠となる利点は実際に存在する。',
 en:'Using "Sélection Massale" as a premium differentiator is backed by an actual advantage described in the textbook.',
 ans:true,
 exp:`正解。教科書p.8は「the vineyard owner is using their own unique planting material...which can enhance fruit quality and/or yield (<b>and can be used as a marketing asset</b>)」と明記。「他にはない独自の素材」というマーケティングの根拠は教科書が認める実際の利点。${p('8','Mass Selection')}`},

// ─── 知って面白い・興味をそそる ───
{type:'mc',cat:'複合・発展',
 q:'「ブドウは本来、鳥のために果実を作っている」という視点から見ると、栽培下のV. viniferaに行われる人間の介入の本質は何か？',
 en:'Vines produce fruit to attract birds for seed dispersal. What is the essence of human intervention in cultivated V. vinifera?',
 opts:['野生の果実よりも甘くして鳥を引き付け受粉を助けるため','鳥向けの果実（種散布用）をワイン向けの果実（適切な糖・酸・タンニン・アロマ）に変えること','鳥に食べられないよう果皮を厚くして収量を守ること','野生では不可能な交差受粉を人工的に行うこと'],
 ans:1,
 exp:`教科書p.1では「grape grower must therefore manipulate the vine to produce grapes with adequate ripeness for wine」と述べる。野生のブドウは鳥に種を散布してもらうために果実を作るが、ワイン生産に適した糖・酸・タンニン・アロマのバランスとは異なる。栽培者はpruning・canopy management・green harvesting等を通じて「鳥向け」から「ワイン向け」に果実を作り変えている。<div class="mnemonic"><div class="ml">🧠 視点の転換</div>ブドウ樹の本来の目的＝種の散布。ワイン醸造家の仕事＝その目的を「美味しいワイン」にハックすること。</div>${p('1','The Vine')}`},

{type:'mc',cat:'複合・発展',
 q:'「Pinot Noir、Meunier、Pinot Blanc、Pinot Gris はすべて Pinot の変異体」という事実から導ける最も興味深い洞察はどれか？',
 en:'All four Pinot varieties are mutations of Pinot. What is the most interesting insight?',
 opts:['交配（cross fertilisation）によって生まれた新品種として登録されている','一見まったく異なる色や特性を持つ品種が、実はほぼ同じDNAから来ている','これら4品種はすべてフランス原産であることを示す','突然変異は必ず悪い変化なので除去すべき'],
 ans:1,
 exp:`これら4品種は交配ではなく「突然変異（mutation）」によって生まれた（p.7–8）。Pinot Noirは黒、Pinot Grisはグレーピンク、Pinot Blancは白、Meunier（ムニエ）は粉をかぶったような見た目。これほど異なる品種が実質的に同じDNAを持っている——わずかな突然変異（おそらく色素遺伝子の変化）がこれだけ異なるワインを生み出す。<div class="mnemonic"><div class="ml">🧠 一族の肖像</div>Pinot一家は「同じ人物の突然変異した分身」。DNAはほぼ同じ、でもワインは全然違う。</div>${p('7–8','Clones')}`},

{type:'mc',cat:'複合・発展',
 q:'ブドウの巻きひげ（tendril）が「自力でトレリスにつかまる」にもかかわらず、栽培者がわざわざケインやシュートを手で結束する理由はどれか？',
 en:'Despite tendrils naturally attaching to trellis wires, growers still manually tie in canes and shoots. Why?',
 opts:['巻きひげは結束力が弱く強風や振動で外れやすいため、栽培者は巻きひげだけに頼らない','巻きひげは美観を損なうため切り取ってから結束する','巻きひげは毒性成分を含むため触れさせてはいけない','法的規制により機械による結束が義務付けられているから'],
 ans:0,
 exp:`教科書p.3に「grape growers typically do not trust the tendrils to hold the vine to the trellis on their own and therefore they tie in canes and shoots as necessary」と明記。強風・大雨・収穫作業の振動・果房の重みなどに対して巻きひげだけでは十分な固定力を持たない。「植物の自助努力を信頼しすぎない」という実践的な栽培判断。${p('3','Tendrils')}`},

{type:'mc',cat:'複合・発展',
 q:'「一つのブドウ樹から取った挿し穂から育てた1000本の樹はすべて遺伝的に同一」という事実は、「テロワール（terroir）」の概念にどんな示唆を与えるか？',
 en:'If 1000 vines from the same cutting are genetically identical, what does this imply about terroir?',
 opts:['すべて同一のワインが生産されるため、テロワールの概念は幻想','遺伝的に同一な樹でも土壌・気候・栽培管理が異なれば果実が異なるため、テロワール差はDNAではなく環境に起因する','遺伝的多様性がないと病害に弱いためテロワールどころではない','クローンが同一なら収量も品質も完全に一定なので区画の差は出ない'],
 ans:1,
 exp:`挿し木で育てた樹はgenetically identical（遺伝的に同一）（p.7）。つまり同じクローンを複数の畑に植えた場合、果実の差は遺伝子ではなく土壌・気候・栽培方法の違いによるもの。これはテロワール概念の科学的裏付けの一つ：「遺伝子が同じでも育つ場所が違えばワインが違う」。実際にDRCなどは同じPinot Noirクローンを使いながら畑ごとに明確に異なるワインを生む。<div class="mnemonic"><div class="ml">🧠 哲学的な問い</div>同じDNA → 違うワイン → 差の正体はテロワール。これが「土地がワインを作る」という考え方の生物学的根拠。</div>${p('7','Clones')}`},

// ─── 統合・判断力を試す問題 ───
{type:'multi',cat:'複合・発展',
 q:'「台木（rootstock）を使わない自根（own-rooted）のV. vinifera栽培」が問題になりうる状況をすべて選んでください。',
 en:'Select all situations where growing V. vinifera on its own roots would be problematic.',
 opts:['フィロキセラが存在する土壌での栽培','取り木（layering）で増やした新しい樹の栽培','砂質土壌での栽培（フィロキセラの移動が困難）','収量コントロールのために台木の特性を利用したい場合','生産者が独自の台木なしワインをマーケティングしたい場合'],
 ans:[0,1,3],
 exp:`①フィロキセラが存在する土壌：V. viniferaは耐性なし→枯死リスク（p.1）✓問題。②取り木の樹：自根のためフィロキセラ耐性なし（p.6–7）✓問題。③砂質土壌：フィロキセラが生存しにくいため自根栽培が可能→問題にならない。④台木の特性（収量制御・土壌適応）を活かしたい場合：台木なしでは不可→問題。⑤マーケティング目的の自根栽培：チリや一部地域で実際に行われており問題ではない。${p('1,6–7','Vine / Propagation')}`},

{type:'multi',cat:'複合・発展',
 q:'「果皮（skin）」の成分と「その成分がワインにもたらす特性」の正しい組み合わせをすべて選んでください。',
 en:'Select all correct pairings of skin components and the wine characteristics they contribute.',
 opts:['タンニン（tannins）→ 渋味と構造（structure）','色素化合物（colour compounds）→ ロゼ・赤ワインの色','アロマ化合物（aroma compounds）→ 品種由来の香り','糖分（sugars）→ ワインのアルコール度数','酸（acids）→ ワインのフレッシュ感'],
 ans:[0,1,2],
 exp:`果皮（skin）には：①タンニン（渋味・構造・熟成ポテンシャル）②色素化合物（赤・ロゼの色）③アロマ化合物・アロマ前駆物質（品種香）が含まれる（p.4）。糖分と酸は主に果肉（pulp）に含まれる。果皮の成分は赤ワインの醸造で「醸し（maceration）」によって抽出される。白ワインは果皮との接触を最小化して色素・タンニンを避ける。${p('4','Grapes')}`},

{type:'multi',cat:'複合・発展',
 q:'Müller-Thurgauについて教科書の記述から正しいといえるものをすべて選んでください。',
 en:'Select all statements about Müller-Thurgau that are correct according to the textbook.',
 opts:['Riesling と Madeleine Royale の cross（クロス）','Riesling に匹敵する品質ポテンシャルを達成した','高収量品種として価値がある','ハイブリッド（hybrid）に分類される','目標はRieslingの品質とMadeleine Royaleの高収量の組み合わせだった'],
 ans:[0,2,4],
 exp:`教科書p.9より：Müller-ThurgauはRiesling × Madeleine Royaleの<b>cross</b>（同種間なのでhybridではない）。目標はRieslingの品質＋Madeleine Royaleの高収量だったが「while it has proved to be a variety valuable for its yields, very few would claim it has the same quality potential as Riesling」→ 品質目標は達成できなかった。高収量品種としての価値は認められている。${p('9','New Grape Varieties')}`},

{type:'order',cat:'複合・発展',
 q:'フィロキセラ危機への対応プロセスを正しい順番に並べてください。',
 en:'Order the response to the phylloxera crisis.',
 items:['フィロキセラがV. viniferaの根を攻撃して壊滅的被害が広がる','北米種がフィロキセラ耐性を持つことを発見する','北米種を台木としてV. viniferaを接ぎ木する方法を確立する','台木接ぎ木苗が世界標準の栽培方法となる','現在も続く台木選択（Planting Materials）の重要性につながる'],
 ans:[0,1,2,3,4],
 exp:`フィロキセラ（phylloxera）は19世紀後半にヨーロッパのブドウ畑を壊滅させた。V. viniferaは耐性を持たないが北米種は共進化で耐性がある（p.1）。台木接ぎ木という解決策が確立され、今日では世界のほぼすべての商業栽培がこの方式を採用。この歴史がPlanting Materialsの章での台木選択の詳細につながる。${p('1','The Vine / Rootstocks')}`},

{type:'multi',cat:'複合・発展',
 q:'「同じV. vinifera品種でも産地や畑によってワインが大きく異なる」という現象の説明に直接貢献するものをすべて選んでください。',
 en:'Select all factors that directly help explain why the same variety produces different wines in different places.',
 opts:['異なる台木は根のホルモン産生と収量に影響し果実特性を変える','異なるクローンは粒の大きさ・収量・皮の厚さなどが異なる','異なる土壌は根の分布・水分吸収に影響する','光合成は葉で行われ、場所が変わっても糖の生産量は変わらない','蒸散による水分ストレスの度合いが土地によって異なり果実の成熟に影響する'],
 ans:[0,1,2,4],
 exp:`テロワール差の要因：①台木が異なれば根のホルモン産生と収量特性が変わる（p.6）②クローンが異なれば果実の物理的特性が異なる（p.7）③土壌が根の分布・水分吸収に影響する（p.6）⑤蒸散と水ストレスの程度が熟成速度に影響する（p.3）。④「糖生産量は変わらない」は誤り——日照・温度・CO₂・水ストレスによって大きく変わる。${p('1–9','全章')}`},

// ========== Chapter 2: 用語（英語） vocab/fill ==========
{type:'vocab',cat:'生育サイクルの用語',ch:2,
 q:'「休眠」を英語で言うと？',en:'What is the English term for「休眠」?',
 opts:['Dormancy','Senescence','Quiescence','Hibernation'],ans:0,
 exp:`Dormancy（休眠）＝冬季に樹の活動が止まり、養分を蓄えて寒さに耐える状態。${DORMANCY_SVG}<div class="mnemonic">🧠「ドーミー（dormi=眠る）でダウン」→ Dormancy＝休眠＝樹が眠っている時期</div><div class="page-ref">${p('10–11','2.1 The Annual Growth Cycle')}</div>`},

{type:'vocab',cat:'生育サイクルの用語',ch:2,
 q:'「萌芽（発芽）」を英語で言うと？',en:'What is the English term for「萌芽」?',
 opts:['Flowering','Véraison','Budburst','Senescence'],ans:2,
 exp:`Budburst（萌芽）＝休眠芽が割れて緑の葉が出てくる、生育サイクルの開始点。${BUDBURST_SVG}<div class="page-ref">${p('11','2.2 From Budburst to Flowering')}</div>`},

{type:'vocab',cat:'生育サイクルの用語',ch:2,
 q:'「ベレゾーン（着色期）」を英語で言うと？',en:'What is the English term for「ベレゾーン」?',
 opts:['Ripening','Véraison','Senescence','Harvest'],ans:1,
 exp:`Véraison（ベレゾーン）＝果粒が軟化し色づき始める転換点。これ以降、糖度上昇・酸度低下が進む。${VERAISON_SVG}<div class="mnemonic">🧠フランス語の「変わる(varier)」が語源→ 果実の色や質感が「変わる」瞬間</div><div class="page-ref">${p('11–13','2.4 Ripening')}</div>`},

{type:'vocab',cat:'生育サイクルの用語',ch:2,
 q:'「受粉」を英語で言うと？',en:'What is the English term for「受粉」?',
 opts:['Fertilisation','Pollination','Fruit set','Germination'],ans:1,
 exp:`Pollination（受粉）＝花粉が柱頭に付着すること。ブドウは両性花で自家受粉が基本。受粉の後に受精(fertilisation)が起こり、結実(fruit set)に至る。${FLOWER_SVG}<div class="page-ref">${p('11','2.2 From Budburst to Flowering')}</div>`},

{type:'vocab',cat:'生育サイクルの用語',ch:2,
 q:'「結実」を英語で言うと？',en:'What is the English term for「結実」?',
 opts:['Fruit set','Fertilisation','Pollination','Véraison'],ans:0,
 exp:`Fruit set（結実）＝受精した花だけが小さな果粒へと成長を始める段階。受粉した花のすべてが結実するわけではない。${FRUITSET_SVG}<div class="page-ref">${p('11','2.3 From Fruit Set to Ripening')}</div>`},

{type:'vocab',cat:'生育サイクルの用語',ch:2,
 q:'「老化・落葉期」を英語で言うと？',en:'What is the English term for「老化・落葉期」?',
 opts:['Dormancy','Senescence','Véraison','Lignification'],ans:1,
 exp:`Senescence（老化・落葉期）＝収穫後、気温低下とともに葉が黄変・落葉し、樹が休眠へ向かう段階。<div class="mnemonic">🧠 Senescence＝「老人(senior)になる」→ 樹が年老いて葉を落とす時期</div><div class="page-ref">${p('13','2.5 Senescence')}</div>`},

{type:'fill',cat:'生育サイクルの用語',ch:2,
 q:'果皮に含まれる赤色色素（アントシアニン）を英語で何という？___',en:'What is the English term for the red pigments found in grape skins?',
 ans:'Anthocyanins',alt:['Anthocyanin','アントシアニン'],
 exp:`Anthocyanins（アントシアニン）＝黒ブドウの果皮に蓄積される赤〜紫の色素群。ベレゾーン以降に合成が進む。白ブドウにはほぼ含まれない。<div class="page-ref">${p('12','2.4 Ripening')}</div>`},

{type:'fill',cat:'生育サイクルの用語',ch:2,
 q:'果実の成熟に伴い苦味から心地よい風味へ変化する、渋み成分を英語で何という？___',en:'What is the English term for the bitter/astringent compounds that soften and change in character as grapes ripen?',
 ans:'Tannins',alt:['Tannin','タンニン'],
 exp:`Tannins（タンニン）＝果皮・種子に含まれるフェノール化合物。成熟が進むにつれ「青く・苦い」状態から「滑らかで心地よい」状態へと質的に変化する（タンニンの重合 polymerisation）。<div class="page-ref">${p('12','2.4 Ripening')}</div>`},

{type:'fill',cat:'生育サイクルの用語',ch:2,
 q:'分子が結合してより大きな分子になる化学変化を英語で何という？___（タンニンが滑らかになる仕組み）',en:'What is the English term for the chemical process in which small molecules join together to form larger ones (responsible for tannins becoming smoother)?',
 ans:'Polymerisation',alt:['Polymerization','重合'],
 exp:`Polymerisation（重合）＝小さな分子同士が結合し大きな分子になる反応。タンニン分子が重合すると、舌に粗く感じられにくくなり「滑らかな」印象に変わる。<div class="mnemonic">🧠 ポリ(poly=多い)＋マー(mer=単位)→ たくさんの単位がつながる＝重合</div><div class="page-ref">${p('12','2.4 Ripening')}</div>`},

{type:'vocab',cat:'生育サイクルの用語',ch:2,
 q:'「結実不良（不結実）」を英語で言うと？',en:'What is the English term for poor/incomplete fruit set caused by cool, wet weather during flowering?',
 opts:['Millerandage','Coulure','Lignification','Senescence'],ans:1,
 exp:`Coulure（クーリュール／花ぶるい）＝開花期の低温・多雨により受精が妨げられ、結実数が大幅に減ること。房の重さや収量に直結する。<div class="compare-table"><table><tr><th>用語</th><th>原因</th><th>結果</th></tr><tr><td>Coulure（花ぶるい）</td><td>開花期の悪天候（低温・降雨・強風）</td><td>結実数そのものが減る</td></tr><tr><td>Millerandage（縮果病）</td><td>開花期の不順な天候・受精不全</td><td>大小不揃いの果粒が混在する房に</td></tr></table></div><div class="page-ref">${p('11','2.2 From Budburst to Flowering')}</div>`},

{type:'vocab',cat:'生育サイクルの用語',ch:2,
 q:'「縮果病（大小不揃いの果粒）」を英語で言うと？',en:'What is the English term for the condition where a bunch contains berries of uneven size due to poor fruit set?',
 opts:['Coulure','Millerandage','Véraison','Lignification'],ans:1,
 exp:`Millerandage（ミルランダージュ／縮果病）＝結実が不完全なため、同じ房の中に正常な果粒と種なしの小さな果粒が混在する現象。<div class="mnemonic">🧠 ミル「ミニ」ランダージュ→ ミニサイズの果粒が混ざる「ばらつき」</div><div class="page-ref">${p('11','2.2 From Budburst to Flowering')}</div>`},

{type:'fill',cat:'生育サイクルの用語',ch:2,
 q:'新梢が成熟し、緑色から茶色く硬い「枝（cane）」に変わる現象を英語で何という？___',en:'What is the English term for the process by which green shoots turn brown and woody as the growing season ends?',
 ans:'Lignification',alt:['木質化'],
 exp:`Lignification（リグニン化／木質化）＝新梢の細胞壁にリグニンが蓄積し、緑色の若い枝(shoot)が茶色く硬い「ケイン(cane)」へと変わる現象。冬の寒さに耐えるための準備でもある。<div class="page-ref">${p('13','2.5 Senescence')}</div>`},

{type:'vocab',cat:'生育サイクルの用語',ch:2,
 q:'樹勢の強さ・旺盛さを表す英語は？',en:'What is the English term for the vigour/vegetative strength of a vine?',
 opts:['Vigour','Vitality','Potency','Capacity'],ans:0,
 exp:`Vigour（樹勢）＝栄養成長（シュート・葉の成長）の旺盛さを示す言葉。土壌の肥沃度や水分供給量が高いほど樹勢は強くなりやすい。樹勢が強すぎると過密な樹冠（キャノピー）になり、果実の成熟に悪影響を与えることがある。<div class="page-ref">${p('10','2.1 The Annual Growth Cycle')}</div>`},

{type:'fill',cat:'生育サイクルの用語',ch:2,
 q:'根から吸収した水・無機養分を樹全体に運ぶ管状組織を英語で何という？___',en:'What is the English term for the vascular tissue that transports water and minerals from the roots upward through the vine?',
 ans:'Xylem',alt:['木部'],
 exp:`Xylem（木部）＝根が吸収した水と無機養分を上方（葉）へ運ぶ通道組織。光合成産物を運ぶ師部(phloem)と対になる輸送経路。${VINE_PARTS_NUTRIENT_SVG}<div class="mnemonic">🧠 サ「キ」シレム→ 根「先」から上に水を「キ（汲）」み上げる</div><div class="page-ref">${p('10','2.1 The Annual Growth Cycle')}</div>`},

{type:'fill',cat:'生育サイクルの用語',ch:2,
 q:'葉で作られた光合成産物（糖など）を樹全体に分配する管状組織を英語で何という？___',en:'What is the English term for the vascular tissue that distributes the products of photosynthesis (such as sugars) from the leaves to the rest of the vine?',
 ans:'Phloem',alt:['師部'],
 exp:`Phloem（師部）＝葉で合成された糖などの同化産物を、果実・根・貯蔵組織など樹全体に分配する通道組織。木部(xylem)とは輸送方向・輸送物が異なる。<div class="page-ref">${p('10','2.1 The Annual Growth Cycle')}</div>`},

{type:'mc',cat:'生育サイクルの用語',ch:2,
 q:'木部（xylem）と師部（phloem）の違いとして正しいものは？',en:'Which statement correctly distinguishes xylem from phloem?',
 opts:['木部は光合成産物を運び、師部は水分を運ぶ','木部は水・無機養分を根から上へ運び、師部は光合成産物を樹全体に分配する','木部と師部はどちらも同じ方向に同じ物質を運ぶ','木部は果実だけに、師部は葉だけに存在する'],ans:1,
 exp:`木部(xylem)＝根→上方向に水・無機養分を輸送。師部(phloem)＝葉で作られた光合成産物（糖など）を樹全体（果実・根・貯蔵器官）に分配。${VINE_PARTS_NUTRIENT_SVG}<div class="page-ref">${p('10','2.1 The Annual Growth Cycle')}</div>`},

{type:'fill',cat:'生育サイクルの用語',ch:2,
 q:'白ブドウ品種の果皮や果汁中に存在し、ピーマンのような青臭い香りに関与する化合物群を英語で何という？___',en:'What is the English term for the aroma compounds associated with green, herbaceous ("green pepper") characters in grapes such as Sauvignon Blanc?',
 ans:'Methoxypyrazines',alt:['Methoxypyrazine','メトキシピラジン'],req:['ethoxypyrazin'],
 exp:`Methoxypyrazines（メトキシピラジン類）＝青草・ピーマンのような香りに関与する芳香化合物。未熟な果実に多く含まれ、成熟（特に十分な日照と熱）が進むにつれて減少する。ソーヴィニヨン・ブランなどで重要な香り成分。<div class="page-ref">${p('12','2.4 Ripening')}</div>`},

{type:'order',cat:'生育サイクルの用語',ch:2,
 q:'花の構造を中心（雌しべ）から外側（雄しべ）に向かって正しい順に並べてください（①柱頭→②花柱→③子房 のグループと、④葯→⑤花糸 のグループの関係を整理する一例として、雌しべの構成要素を上から下へ並べる）。',en:'Arrange the parts of the pistil (female organ) from the top (where pollen lands) to the bottom (where seeds form).',
 items:['柱頭（stigma）','花柱（style）','子房（ovary）','胚珠（ovule）'],
 ans:[0,1,2,3],
 exp:`雌しべ(pistil)は上から「柱頭(stigma)→花柱(style)→子房(ovary)」の順に構成され、子房の中に種となる胚珠(ovule)が入っている。花粉は柱頭に付着後、花粉管を伸ばして胚珠まで到達し受精する。${FLOWER_SVG}<div class="page-ref">${p('11','2.2 From Budburst to Flowering')}</div>`},

{type:'tf',cat:'生育サイクルの用語',ch:2,
 q:'「Lag phase（ラグフェーズ）」とは、ベレゾーンの直前に見られる果実の成長が一時的に停滞する期間のことである。',en:'The "lag phase" refers to a period shortly before véraison during which berry growth temporarily slows or pauses.',
 ans:true,
 exp:`正しい。Lag phase（停滞期）は結実後の急成長期とベレゾーン以降の第二の成長期の「間」に挟まれる、成長が緩やかになる期間。この間に種子が発達し、果実内部で成熟への準備が進む。<div class="page-ref">${p('11–12','2.3 From Fruit Set to Ripening')}</div>`},
// ========== Chapter 2: 年間生育サイクル（概観） ==========
{type:'mc',cat:'年間生育サイクル',ch:2,
 q:'ブドウ樹が休眠から目覚め、新たな生育サイクルが始まる引き金となるのは何か？',en:'What triggers the vine to break dormancy and begin a new growth cycle?',
 opts:['日照時間が一定を超えること','土壌の養分濃度が上昇すること','気温が約10℃を超えて上昇すること','収穫から一定の日数が経過すること'],ans:2,
 exp:`気温が約10℃を超えて上昇すると、樹は休眠から目覚めて新たな生育サイクル（年間サイクル）が始まる。これは樹液の動き出し（sap rising / bleeding）や萌芽の前段階となる。${CYCLE_WHEEL_SVG}<div class="page-ref">${p('10','2.1 The Annual Growth Cycle')}</div>`},

{type:'tf',cat:'年間生育サイクル',ch:2,
 q:'北半球と南半球では、ブドウ樹の年間生育サイクルが起こる時期（月）が約6か月ずれる。',en:'The timing of the vine’s annual growth cycle is offset by roughly six months between the northern and southern hemispheres.',
 ans:true,
 exp:`正しい。北半球で3月頃に萌芽する地域では、南半球では9月頃に萌芽が起こる、というように季節が逆になるため約6か月のずれが生じる。生育サイクルの「順序」自体は両半球とも同じ。<div class="mnemonic">🧠 地球は丸い→赤道を挟んで季節は逆転、サイクルの順番は不変</div><div class="page-ref">${p('10','2.1 The Annual Growth Cycle')}</div>`},

{type:'order',cat:'年間生育サイクル',ch:2,
 q:'ブドウ樹の年間生育サイクルを正しい順序に並べてください。',en:'Place the stages of the vine’s annual growth cycle in the correct order.',
 items:['休眠（dormancy）','萌芽（budburst）','開花（flowering）','結実（fruit set）','ベレゾーン（véraison）','収穫（harvest）'],
 ans:[0,1,2,3,4,5],
 exp:`年間生育サイクルは「休眠→萌芽→開花→結実→ベレゾーン→収穫」の順に進行し、収穫後は再び落葉・休眠へと向かう。${CYCLE_WHEEL_SVG}<div class="page-ref">${p('10–13','2.1–2.5')}</div>`},

{type:'fill',cat:'年間生育サイクル',ch:2,
 q:'休眠期に樹が养分（炭水化物）を蓄える主な場所は、根と___である。',en:'During dormancy, in addition to the roots, where else does the vine store carbohydrate reserves?',
 ans:'幹（trunk）',alt:['幹','トランク','trunk','permanent wood','永久樹体'],
 exp:`休眠期、樹は翌年の萌芽・初期成長に使う炭水化物（デンプンなど）を根と幹（永久的な樹体組織）に蓄える。これらの蓄えが、春先の新梢の急速な成長を支えるエネルギー源となる。${DORMANCY_SVG}<div class="page-ref">${p('10','2.1 The Annual Growth Cycle')}</div>`},

{type:'mc',cat:'年間生育サイクル',ch:2,
 q:'春先に気温が上昇し樹液が動き出す現象は、剪定した切り口から樹液がしみ出す様子から英語で何と呼ばれるか？',en:'What is the term for the phenomenon, observed as sap oozes from pruning cuts in early spring, that signals the vine is becoming active again?',
 opts:['Flowering','Bleeding（樹液の滲出）','Senescence','Véraison'],ans:1,
 exp:`Bleeding（ブリーディング／樹液の滲出）＝気温上昇により根からの水分の吸い上げが活発化し、剪定で切られた枝の切り口から樹液がしみ出す現象。萌芽に先立つ「樹が目覚めたサイン」として知られる。<div class="mnemonic">🧠 樹が「出血(bleeding)」しているように見える→ 樹液が滲み出る春のサイン</div><div class="page-ref">${p('10','2.1 The Annual Growth Cycle')}</div>`},

{type:'mc',cat:'年間生育サイクル',ch:2,
 q:'1年の生育サイクルにおいて、樹が栄養成長（シュートと葉の成長）に多くのエネルギーを割く時期として最も適切なのはどれか？',en:'During which part of the annual cycle does the vine devote much of its energy to vegetative growth (shoots and leaves)?',
 opts:['休眠期','萌芽から開花にかけて','収穫直後','落葉期'],ans:1,
 exp:`萌芽から開花にかけての時期は、新梢と葉が急速に伸長する栄養成長(vegetative growth)が盛んな時期。開花期前後にシュートの伸長速度はピークを迎え、その後は徐々に減速して果実の成熟にエネルギーが向けられるようになる。${SHOOT_GROWTH_SVG}<div class="page-ref">${p('11','2.2 From Budburst to Flowering')}</div>`},

{type:'mc',cat:'年間生育サイクル',ch:2,
 q:'生育サイクルの中で、樹のエネルギーの配分が「栄養成長（シュート・葉）中心」から「生殖成長（果実の成熟）中心」へと移行していく転換点として最も近いのはどれか？',en:'Which point in the cycle most closely marks the shift in the vine’s energy allocation from vegetative growth toward ripening the fruit?',
 opts:['休眠期の終わり','ベレゾーン前後','受粉の直前','落葉直後'],ans:1,
 exp:`ベレゾーン前後を境に、樹のエネルギーは新梢や葉を伸ばす栄養成長から、糖の蓄積や色素・香り成分の生成といった果実の成熟（生殖成長）へと重点を移していく。${RIPENING_CURVE_SVG}<div class="page-ref">${p('11–13','2.4 Ripening')}</div>`},

{type:'multi',cat:'年間生育サイクル',ch:2,
 q:'年間生育サイクルにおいて、気温が大きく関わる現象を2つ選んでください。',en:'Select two phenomena in the annual growth cycle that are strongly influenced by temperature.',
 opts:['休眠から目覚めるタイミング（樹液の動き出し）','果皮の色（品種固有の遺伝形質）','萌芽から開花までの期間の長さ','ラベルに記載される生産者名'],ans:[0,2],
 exp:`気温は、休眠から目覚めるタイミング（約10℃が目安）や、各生育段階（萌芽→開花、開花→収穫など）に要する期間の長さに大きく影響する。気温が高い年は生育が早く進み、低い年は遅れる傾向がある。<div class="page-ref">${p('10–13','2.1–2.5')}</div>`},

{type:'fill',cat:'年間生育サイクル',ch:2,
 q:'収穫から落葉・休眠に至るまでの、葉が黄変し光合成能力が低下していく期間を___という。',en:'What is the term for the period after harvest when leaves turn yellow/red and photosynthetic activity declines as the vine prepares for dormancy?',
 ans:'老化期（senescence）',alt:['老化期','老化','senescence','落葉期'],
 exp:`収穫後、気温の低下とともに葉が黄変・変色し、光合成能力が落ちていく期間を老化期(senescence)と呼ぶ。この時期、樹は最後のエネルギーを根や幹に養分として送り込み、冬の休眠に備える。<div class="page-ref">${p('13','2.5 Senescence')}</div>`},

{type:'tf',cat:'年間生育サイクル',ch:2,
 q:'生育サイクルの各段階に要する期間は、気候や栽培地域に関わらず常に一定である。',en:'The length of each stage of the growth cycle is always the same, regardless of climate or region.',
 ans:false,
 exp:`誤り。各段階の長さは気候条件（特に気温）や品種、栽培地域によって変動する。たとえば冷涼な地域では生育サイクル全体がゆっくり進み、温暖な地域では早く進行する傾向がある。<div class="page-ref">${p('10–13','2.1–2.5')}</div>`},

{type:'mc',cat:'年間生育サイクル',ch:2,
 q:'生育サイクルにおいて、樹が「最も多くのエネルギーを蓄える」段階として適切なのは？',en:'During which stage does the vine accumulate the carbohydrate reserves it will rely on at the start of the next cycle?',
 opts:['開花期','収穫後〜休眠期にかけて','結実直後','ベレゾーン直前'],ans:1,
 exp:`収穫後の老化期から休眠期にかけて、樹は葉で作られた最後の光合成産物を根・幹に養分として蓄積する。これが翌春の萌芽や初期の新梢成長を支えるエネルギー源となる。${DORMANCY_SVG}<div class="page-ref">${p('13','2.5 Senescence')}</div>`},

{type:'mc',cat:'年間生育サイクル',ch:2,
 q:'ある年、春先の気温上昇が例年より早かった場合、その年の生育サイクル全体にはどのような傾向が予想されるか？',en:'If spring temperatures rise earlier than usual in a given year, what trend would you expect across that year’s growth cycle?',
 opts:['萌芽は早まるが収穫時期は変わらない','生育サイクル全体が前倒しになりやすい（早期収穫につながりやすい）','休眠期が長くなる','果実の成熟が常に妨げられる'],ans:1,
 exp:`春の気温上昇が早いと、休眠の終わりや萌芽が早まり、その後の各段階（開花・結実・ベレゾーン・収穫）も連鎖的に前倒しになりやすい。これは「早熟年(early vintage)」につながる典型的なパターン。<div class="page-ref">${p('10–13','2.1–2.5')}</div>`},

{type:'vocab',cat:'年間生育サイクル',ch:2,
 q:'「栄養成長」を英語で言うと？',en:'What is the English term for「栄養成長」(growth of shoots, leaves, and other green parts)?',
 opts:['Reproductive growth','Vegetative growth','Generative growth','Secondary growth'],ans:1,
 exp:`Vegetative growth（栄養成長）＝シュート・葉など緑色部分の成長。果実の成熟に関わる成長は Reproductive growth（生殖成長）と呼ばれ区別される。<div class="page-ref">${p('11','2.2 From Budburst to Flowering')}</div>`},
// ========== Chapter 2: 萌芽から開花まで ==========
{type:'mc',cat:'萌芽〜開花',ch:2,
 q:'萌芽（budburst）が起こるための主な条件は何か？',en:'What is the main condition required for budburst to occur?',
 opts:['日照時間が16時間を超えること','気温が一定の閾値を超えて上昇すること','降水量が十分にあること','前年の収量が少なかったこと'],ans:1,
 exp:`気温が一定の閾値（樹液が動き出す約10℃前後）を超えて上昇することで、休眠芽が膨らみ萌芽（budburst）が起こる。これは生育サイクルの目に見える「開始点」となる。${BUDBURST_SVG}<div class="page-ref">${p('10–11','2.2 From Budburst to Flowering')}</div>`},

{type:'tf',cat:'萌芽〜開花',ch:2,
 q:'萌芽期の新芽は霜の被害を受けにくく、栽培者は霜害対策をほとんど考慮しなくてよい。',en:'Buds that have just burst are resistant to frost damage, so growers need not worry much about frost protection at this stage.',
 ans:false,
 exp:`誤り。萌芽したばかりの新芽は非常に柔らかく霜に対して極めて脆弱で、遅霜（spring frost）により大きな被害（収量減少）を受けるリスクが高い。栽培者は風車・散水・燃焼（霜対策用ヒーター等）といった防霜対策を講じることがある。<div class="mnemonic">🧠 赤ちゃん（新芽）は寒さに弱い→ 霜から守る必要あり</div><div class="page-ref">${p('11','2.2 From Budburst to Flowering')}</div>`},

{type:'mc',cat:'萌芽〜開花',ch:2,
 q:'萌芽から開花までの間に、新梢上で進行する成長として正しい組み合わせはどれか？',en:'Which best describes the growth that takes place on the shoot between budburst and flowering?',
 opts:['花のみが成長し、葉やシュートはほとんど伸びない','シュート・葉が急速に成長し、同時に花房（花序）が発達する','果実がすでに成熟し始めている','樹は再び休眠状態に入る'],ans:1,
 exp:`萌芽後、新梢と葉が急速に成長すると同時に、将来の花となる花序（inflorescence）も発達していく。これは栄養成長と生殖器官の準備が並行して進む重要な期間。<div class="page-ref">${p('11','2.2 From Budburst to Flowering')}</div>`},

{type:'fill',cat:'萌芽〜開花',ch:2,
 q:'ブドウの花は、雄しべと雌しべの両方を1つの花に持つ「___花」であるため、基本的に自家受粉する。',en:'Grapevine flowers are described as "______" flowers, containing both male and female parts, which allows them to self-pollinate.',
 ans:'両性',alt:['両性花','hermaphrodite','self-fertile'],
 exp:`ブドウ（Vitis vinifera）の花は雄しべ(stamen)と雌しべ(pistil)を1つの花に持つ両性花(hermaphrodite flower)であるため、他家受粉に頼らず自家受粉(self-pollination)で結実できる。これは栽培上、安定した結実を得やすい大きな利点。${FLOWER_SVG}<div class="page-ref">${p('11','2.2 From Budburst to Flowering')}</div>`},

{type:'mc',cat:'萌芽〜開花',ch:2,
 q:'開花期に低温・降雨・強風などの悪天候が続くと、どのような影響が生じやすいか？',en:'What is the likely consequence of cold, wet, or windy weather persisting during the flowering period?',
 opts:['果実の糖度が予定より高くなる','受粉・結実が妨げられ、コゥルーレやミルランダージュが発生しやすくなる','果皮の色素形成が促進される','収穫時期が早まる'],ans:1,
 exp:`開花期の悪天候（低温・多雨・強風）は、花粉の活動や受精のプロセスを妨げ、結実不良（コゥルーレ coulure）や、房の中で果粒の大きさが不揃いになる現象（ミルランダージュ millerandage）を引き起こしやすくする。これらは収量と品質の双方に影響する。<div class="compare-table"><table><tr><th>用語</th><th>内容</th></tr><tr><td>Coulure</td><td>結実数が大きく減少する</td></tr><tr><td>Millerandage</td><td>房の中に大小不揃いの果粒が混在する</td></tr></table></div><div class="page-ref">${p('11','2.2 From Budburst to Flowering')}</div>`},

{type:'mc',cat:'萌芽〜開花',ch:2,
 q:'花が咲く前、花の各器官を覆っている「キャリプトラ（花冠帽）」と呼ばれる構造の役割として正しいものはどれか？',en:'What is the role of the "calyptra" (the cap-like structure covering the flower before it opens)?',
 opts:['花粉を生成する','受精後に種子を保護する','開花前に花の各器官（雄しべ・雌しべ）を保護し、開花時に脱落する','果実の色素を生成する'],ans:2,
 exp:`キャリプトラ(calyptra)は、開花前に花冠（花弁が融合した構造）が帽子のように雄しべ・雌しべを覆い保護している部分。開花のタイミングでこれが脱落（落下）し、中の生殖器官が露出して受粉が可能になる。${FLOWER_SVG}<div class="page-ref">${p('11','2.2 From Budburst to Flowering')}</div>`},

{type:'order',cat:'萌芽〜開花',ch:2,
 q:'開花〜結実のプロセスを正しい順に並べてください。',en:'Place the steps of the flowering-to-fruit-set process in the correct order.',
 items:['キャリプトラが脱落し花が開く','花粉が柱頭に付着する（受粉）','花粉管が伸びて胚珠に達し受精する','受精した花が小さな果粒へ成長する（結実）'],
 ans:[0,1,2,3],
 exp:`開花は「①キャリプトラの脱落→②受粉(pollination)→③受精(fertilisation、花粉管が胚珠に到達)→④結実(fruit set)」という順序で進む。受粉しても受精に至らない、あるいは受精しても結実しない花もあり、これが房全体の最終的な果粒数を左右する。${FRUITSET_SVG}<div class="page-ref">${p('11','2.2 From Budburst to Flowering')}</div>`},

{type:'tf',cat:'萌芽〜開花',ch:2,
 q:'1つの花房（花序）にある全ての花が結実するわけではない。',en:'Not every flower on an inflorescence goes on to develop into a berry.',
 ans:true,
 exp:`正しい。受粉や受精が成功しなかった花は結実せず脱落する。最終的に結実する花の割合は天候や樹の状態によって変動し、これが収量や房の構造に影響する。<div class="page-ref">${p('11','2.2 From Budburst to Flowering')}</div>`},

{type:'mc',cat:'萌芽〜開花',ch:2,
 q:'開花期前後に新梢の伸長速度がピークに達する理由として最も適切な説明はどれか？',en:'Why does shoot growth typically peak around the time of flowering?',
 opts:['この時期は気温が最も低いため成長が抑制される','樹が栄養成長に多くのエネルギーを割いており、その後は徐々に生殖成長へ移行するため','果実がすでに成熟しているため養分が不要になるから','休眠期に入る準備をしているため'],ans:1,
 exp:`開花期前後は樹のエネルギー配分が栄養成長（シュート・葉の伸長）に大きく傾いており、新梢の伸長速度はこの時期にピークを迎える。その後は徐々に減速し、エネルギーは果実の発達・成熟（生殖成長）に向けられていく。${SHOOT_GROWTH_SVG}<div class="page-ref">${p('11','2.2 From Budburst to Flowering')}</div>`},

{type:'fill',cat:'萌芽〜開花',ch:2,
 q:'開花期、花粉が柱頭に付着したのち、花粉管が伸びて胚珠まで到達し受精に至るプロセスを___という。',en:'What is the term for the process in which pollen grows a tube down to the ovule, leading to fertilisation?',
 ans:'受精（fertilisation）',alt:['受精','fertilisation','fertilization'],
 exp:`受粉(pollination)で柱頭に付着した花粉は、花粉管を子房内の胚珠まで伸ばし、これが到達することで受精(fertilisation)が成立する。受精した花だけが結実(fruit set)に進む。<div class="page-ref">${p('11','2.2 From Budburst to Flowering')}</div>`},

{type:'mc',cat:'萌芽〜開花',ch:2,
 q:'ブドウが両性花であることが栽培者にとって有利である理由として、最も適切なものはどれか？',en:'Why is it advantageous for growers that the grapevine flower is hermaphrodite?',
 opts:['果実の色が濃くなるから','受粉樹（pollinator vines）を別途植える必要がなく、安定した結実が見込めるから','収穫の時期が早まるから','病害に対する耐性が高まるから'],ans:1,
 exp:`両性花であるため、ブドウは別の品種・受粉樹を必要とせず自家受粉で結実できる。これにより栽培者は単一品種だけの畑を作ることができ、結実の安定性も高まる（風や昆虫による他家受粉に依存する植物に比べ管理しやすい）。<div class="page-ref">${p('11','2.2 From Budburst to Flowering')}</div>`},

{type:'multi',cat:'萌芽〜開花',ch:2,
 q:'萌芽から開花にかけての時期にリスクとなる気象条件を2つ選んでください。',en:'Select two weather-related risks that are especially relevant during the budburst-to-flowering period.',
 opts:['遅霜（晩霜）による新芽への被害','開花期の低温・多雨による結実不良','収穫期の高温による過熟','果実成熟期の日照不足のみ'],ans:[0,1],
 exp:`萌芽期の遅霜は柔らかい新芽に深刻なダメージを与え、開花期の低温・多雨はコゥルーレやミルランダージュなど結実不良の原因となる。どちらも収量に直結するため、栽培者がこの時期に最も警戒する気象リスク。<div class="page-ref">${p('11','2.2 From Budburst to Flowering')}</div>`},
// ========== Chapter 2: 結実から成熟まで ==========
{type:'mc',cat:'結実〜成熟',ch:2,
 q:'結実後、果実が成長していく過程について正しい説明はどれか？',en:'Which statement correctly describes the pattern of berry growth after fruit set?',
 opts:['果実は一定の速度で収穫まで成長し続ける','急成長→停滞（ラグフェーズ）→再び成長、という二段階の成長パターンをたどる','成長は結実直後の数日間でほぼ完了する','成長はベレゾーンの後にしか始まらない'],ans:1,
 exp:`果実は結実後、まず細胞分裂による急速な成長期を迎え、その後「ラグフェーズ(lag phase)」と呼ばれる成長が緩やかになる期間を経て、ベレゾーン以降に再び（今度は細胞の肥大による）成長期に入るという、二段階の成長パターン（二重S字曲線）をたどる。<div class="page-ref">${p('11–12','2.3 From Fruit Set to Ripening')}</div>`},

{type:'fill',cat:'結実〜成熟',ch:2,
 q:'結実後の急成長期とベレゾーン以降の成長期の間に挟まれる、成長が一時的に緩やかになる期間を___という。',en:'What is the term for the period of slowed berry growth that occurs between the initial rapid growth phase and the post-véraison growth phase?',
 ans:'ラグフェーズ（lag phase）',alt:['ラグフェーズ','lag phase','停滞期'],
 exp:`ラグフェーズ(lag phase)は、結実直後の急成長期とベレゾーン以降の第二の成長期との「間」に挟まれる、成長が緩やかになる期間。この間、種子が成熟し、果実は次の成長段階への準備を進める。<div class="page-ref">${p('11–12','2.3 From Fruit Set to Ripening')}</div>`},

{type:'mc',cat:'結実〜成熟',ch:2,
 q:'ベレゾーン（véraison）の時点で起こる変化として適切なものはどれか？',en:'What changes take place at véraison?',
 opts:['果実が完全に成熟し、収穫の準備が整う','果実が軟化し、色づき始める（黒ブドウは赤紫〜黒、白ブドウは半透明の黄色がかった色へ）','果実の大きさの成長が完全に止まる','果皮のタンニンが消失する'],ans:1,
 exp:`ベレゾーンでは、それまで硬く緑色だった果実が軟化し色づき始める。黒ブドウ品種ではアントシアニンの蓄積により赤紫〜黒に、白ブドウ品種では半透明の黄色がかった色合いに変化していく。これ以降、糖度の上昇と酸度の低下が本格的に進む。${VERAISON_SVG}<div class="page-ref">${p('11–12','2.4 Ripening')}</div>`},

{type:'tf',cat:'結実〜成熟',ch:2,
 q:'同じ房の中でも、すべての果粒が同時にベレゾーンを迎えるとは限らない。',en:'Not all berries on the same bunch necessarily reach véraison at exactly the same time.',
 ans:true,
 exp:`正しい。ベレゾーンの進行には房内・樹内でばらつきがあり、同じ房でも色づきが先に進む果粒と遅れる果粒が混在することがある。これは収穫のタイミングを判断する難しさにもつながる。<div class="page-ref">${p('11–12','2.4 Ripening')}</div>`},

{type:'mc',cat:'結実〜成熟',ch:2,
 q:'成熟期（ベレゾーン以降）に進行する変化として正しい組み合わせはどれか？',en:'Which combination correctly describes the changes that occur during ripening (after véraison)?',
 opts:['糖度が上昇し、酸度が低下する','糖度が低下し、酸度が上昇する','糖度・酸度ともに変化しない','タンニンの量と質はベレゾーン前後で変わらない'],ans:0,
 exp:`成熟期には光合成で作られた糖が果実に蓄積されて糖度が上昇する一方、リンゴ酸を中心とした酸が呼吸により消費され酸度は低下する。同時にタンニンは重合(polymerisation)が進んで質感が滑らかになり、色素や香り成分（アントシアニン・テルペン類など）も増加する。${RIPENING_CURVE_SVG}<div class="page-ref">${p('12–13','2.4 Ripening')}</div>`},

{type:'multi',cat:'結実〜成熟',ch:2,
 q:'成熟期に増加する成分・特徴を2つ選んでください。',en:'Select two things that increase as grapes ripen.',
 opts:['糖度（sugar）','色素（黒ブドウのアントシアニンなど）','酸度（acidity）','青臭い香り（メトキシピラジン由来）'],ans:[0,1],
 exp:`成熟が進むと糖度や色素（アントシアニンなど）は増加する一方、酸度やメトキシピラジン由来の青臭い香りは減少していく。これらの変化のバランスを見極めることが、収穫適期の判断につながる。<div class="page-ref">${p('12–13','2.4 Ripening')}</div>`},

{type:'mc',cat:'結実〜成熟',ch:2,
 q:'成熟期に果実中の酸度（特にリンゴ酸）が低下する主な理由は何か？',en:'Why does acidity (particularly malic acid) tend to decrease in the berry as it ripens?',
 opts:['果実が水分を失い濃縮されるため','気温が高い時期に呼吸（respiration）によって酸が消費されるため','光合成が完全に停止するため','酸が果皮から雨水で洗い流されるため'],ans:1,
 exp:`気温が高くなる成熟期には、果実内の呼吸（respiration）が活発になり、リンゴ酸を中心とした酸が消費（代謝）されて減少する。気温が高い産地・年ほど酸度の低下が進みやすく、冷涼な産地・年ほど酸が残りやすい。<div class="page-ref">${p('12–13','2.4 Ripening')}</div>`},

{type:'mc',cat:'結実〜成熟',ch:2,
 q:'成熟期に果実の風味成分（アロマ前駆体やフレーバー化合物）が発達するために特に重要な環境要因はどれか？',en:'Which environmental factor is especially important for the development of aroma/flavour compounds during ripening?',
 opts:['土壌のpH値のみ','十分な日照と適度な温度','収穫時の労働力の確保','貯蔵タンクの容量'],ans:1,
 exp:`十分な日照と適度な温度は、糖度上昇だけでなく、香り・風味化合物（テルペン類、ノリソプレノイド類など）の発達やメトキシピラジン（青臭い香り）の減少にも深く関わる。これらのバランスがブドウの「成熟度」を構成する重要な要素となる。<div class="page-ref">${p('12–13','2.4 Ripening')}</div>`},

{type:'tf',cat:'結実〜成熟',ch:2,
 q:'「成熟（ripening）」とは単に糖度が一定の値に達することのみを指す。',en:'"Ripening" refers solely to sugar levels reaching a particular value.',
 ans:false,
 exp:`誤り。成熟は糖度の上昇だけでなく、酸度の低下、タンニンの重合（質感の変化）、色素・香り化合物の発達など、複数の要素が同時並行で進む複合的なプロセスである。栽培者や醸造家は、これら複数の指標を総合して収穫のタイミングを判断する。<div class="mnemonic">🧠 成熟＝「糖↑酸↓色↑香り↑タンニンの質変化」の総合評価</div><div class="page-ref">${p('12–13','2.4 Ripening')}</div>`},

{type:'fill',cat:'結実〜成熟',ch:2,
 q:'成熟期に細胞内の小さな分子が結びつき大きな分子になることで、タンニンが粗い印象から滑らかな印象に変わる現象を、化学用語で___という。',en:'What chemical term describes the process by which tannin molecules join together, resulting in a softer, smoother impression on the palate?',
 ans:'重合（ポリメリゼーション／polymerisation）',alt:['重合','polymerisation','ポリメリゼーション'],
 exp:`タンニン分子が重合(polymerisation)すると分子が大きくなり、舌に「粗い」「収斂性が強い」と感じられにくくなる。これにより、未熟なタンニンの「青く・固い」印象から、熟したタンニンの「滑らかで丸みのある」印象へと質的に変化する。<div class="page-ref">${p('12','2.4 Ripening')}</div>`},

{type:'mc',cat:'結実〜成熟',ch:2,
 q:'栽培者が収穫のタイミングを決定する際に考慮する要素として、最も適切な組み合わせはどれか？',en:'Which combination of factors would a grower most likely weigh when deciding when to harvest?',
 opts:['糖度・酸度・タンニンの成熟度・香味成分の発達・天候予報','果樹園の景観の美しさのみ','前年の収穫日とまったく同じ日付','収穫機の納期のみ'],ans:0,
 exp:`収穫のタイミングは、糖度・酸度・タンニン（フェノール）の成熟度、香味成分の発達、目指すワインのスタイル、さらに収穫前後の天候予報など、複数の要素を総合して判断される。これらは年ごと・区画ごとに異なるため、画一的な基準では決められない。<div class="page-ref">${p('12–13','2.4 Ripening')}</div>`},

{type:'tf',cat:'結実〜成熟',ch:2,
 q:'冷涼な気候の産地で栽培されたブドウは、温暖な産地のものに比べて、収穫時の酸度が高く保たれる傾向がある。',en:'Grapes grown in cooler climates tend to retain higher acidity at harvest compared with those grown in warmer climates.',
 ans:true,
 exp:`正しい。気温が低い産地では呼吸による酸の消費が穏やかなため、収穫時にも比較的高い酸度が保たれやすい。これは冷涼産地のワインが「フレッシュ」「シャープ」と評されることが多い理由の一つでもある。<div class="page-ref">${p('12–13','2.4 Ripening')}</div>`},

{type:'mc',cat:'結実〜成熟',ch:2,
 q:'メトキシピラジン（青臭い香りに関わる化合物）は、成熟が進むにつれてどのように変化するか？',en:'How do methoxypyrazine levels typically change as the grapes ripen?',
 opts:['増加し続け、収穫時に最大となる','減少していく傾向がある','ベレゾーン後に初めて生成される','変化しない'],ans:1,
 exp:`メトキシピラジン類は未熟な果実に多く含まれ、十分な日照と熱を受けながら成熟が進むにつれて減少していく傾向がある。日照不足や冷涼すぎる年には、収穫時にも青臭い香りが残りやすくなる。<div class="page-ref">${p('12','2.4 Ripening')}</div>`},
// ========== Chapter 2: 老化と休眠 ==========
{type:'mc',cat:'老化と休眠',ch:2,
 q:'収穫後、老化期（senescence）に樹の中で起こる変化として正しいものはどれか？',en:'What happens within the vine during the post-harvest senescence period?',
 opts:['新しい花房が形成され始める','葉が黄変・変色し、光合成産物が根や幹に養分として送られる','果実の成熟が再び始まる','新梢が急速に伸長を始める'],ans:1,
 exp:`収穫後、気温の低下とともに葉が黄色や赤色に変色し、光合成の能力が落ちていく。この間、葉で作られた最後の光合成産物（炭水化物）は根や幹といった永久的な組織へ送られ、翌年の萌芽に向けたエネルギー源として蓄積される。${DORMANCY_SVG}<div class="page-ref">${p('13','2.5 Senescence')}</div>`},

{type:'fill',cat:'老化と休眠',ch:2,
 q:'老化期に新梢の細胞壁にリグニンが蓄積し、緑色の若い枝が茶色く硬い「ケイン」に変わる現象を___という。',en:'What is the term for the process during senescence in which green shoots become brown, hardened canes through lignin deposition?',
 ans:'リグニン化（木質化／lignification）',alt:['リグニン化','木質化','lignification'],
 exp:`リグニン化(lignification)により、新梢(シュート)の細胞壁が硬化し、緑色の若い枝が茶色く木質化した「ケイン(cane)」へと変化する。これは冬の寒さに耐えるための準備であり、また翌年の剪定やケイン仕立て(cane pruning)にも関わる重要な変化。<div class="page-ref">${p('13','2.5 Senescence')}</div>`},

{type:'mc',cat:'老化と休眠',ch:2,
 q:'樹が「休眠状態に入った」と判断される目安となる条件は何か？',en:'What is generally used as the marker that the vine has entered dormancy?',
 opts:['すべての果実が収穫されたこと','気温が約10℃を下回るようになり、葉がすべて落ちたこと','土壌が完全に乾燥したこと','剪定がすべて完了したこと'],ans:1,
 exp:`気温が約10℃を下回るようになると樹の活動は停止し、葉がすべて落ちて(落葉/leaf fall)休眠状態に入る。休眠期の樹は外見上「枯れている」ように見えるが、内部では蓄えた養分を使い、寒さに耐えながら次の生育サイクルへの準備が静かに進んでいる。${DORMANCY_SVG}<div class="page-ref">${p('13','2.5 Senescence')}</div>`},

{type:'tf',cat:'老化と休眠',ch:2,
 q:'休眠期の剪定（winter pruning）は、樹形を整えるとともに、翌年の収量や樹勢のバランスを調整する重要な作業である。',en:'Winter (dormant-season) pruning shapes the vine and also helps growers manage the following year’s yield and vine balance.',
 ans:true,
 exp:`正しい。休眠期は葉が落ち樹液の動きが少ないため、樹へのダメージを抑えながら剪定を行いやすい時期。剪定によって翌年伸びる新梢の数や位置をコントロールし、収量や樹勢のバランス、果実の質を調整することができる。<div class="page-ref">${p('13','2.5 Senescence')}</div>`},

{type:'mc',cat:'老化と休眠',ch:2,
 q:'冬季の極端な低温（凍結）が樹に与えるリスクとして適切なものはどれか？',en:'What risk does extreme winter cold (freezing temperatures) pose to the vine?',
 opts:['萌芽が早まり収量が増加する','幹や芽の組織が損傷し、最悪の場合枯死につながることがある','果実の糖度が上昇する','樹液の流れが活発化する'],ans:1,
 exp:`極端な低温・凍結は、休眠中の樹であっても幹や芽の組織にダメージを与え、深刻な場合は枝や樹そのものが枯死することもある。冷涼すぎる気候帯でのブドウ栽培が難しい理由の一つであり、土を盛って樹を覆う「ヒリング・アップ(hilling up)」などの防寒対策がとられる地域もある。<div class="page-ref">${p('13','2.5 Senescence')}</div>`},

{type:'mc',cat:'老化と休眠',ch:2,
 q:'休眠期に樹が見せる「外見上は活動を停止しているが、内部では次のサイクルへの準備が進んでいる」という特徴を最もよく表す説明はどれか？',en:'Which best captures the paradox of dormancy — the vine appears inactive but is in fact preparing for the next cycle?',
 opts:['休眠期の樹は完全に死んでいる状態にある','外見上は活動を止めているように見えるが、根や幹に蓄えた養分を使いながら寒さに耐え、春の萌芽に備えている','休眠期にも新梢の成長と結実が継続している','休眠期は気温に関係なく一定期間で自動的に終了する'],ans:1,
 exp:`休眠期の樹は葉を落とし外見上「眠っている」ように見えるが、内部では秋までに蓄積した炭水化物などの養分を使いながら低温に耐え、気温が再び上昇するときに備えて次の生育サイクルへの準備を進めている。<div class="mnemonic">🧠 休眠＝「省エネモード」で待機しつつ、次の春への準備を怠らない</div><div class="page-ref">${p('10','2.1 The Annual Growth Cycle')}</div>`},

{type:'multi',cat:'老化と休眠',ch:2,
 q:'老化期から休眠期にかけて樹に起こる変化を2つ選んでください。',en:'Select two changes that occur in the vine as it moves from senescence into dormancy.',
 opts:['葉が黄変・変色し、やがて落葉する','新梢の細胞壁にリグニンが蓄積し木質化が進む','花序の形成が活発になる','果実の糖度がさらに大きく上昇する'],ans:[0,1],
 exp:`老化期から休眠期にかけては、葉の黄変・落葉とリグニン化（木質化）が並行して進行する。これらはいずれも、寒さに耐えるための準備であり、果実関連の変化（花序形成や糖度上昇）はこの時期にはすでに収束している。<div class="page-ref">${p('13','2.5 Senescence')}</div>`},

{type:'fill',cat:'老化と休眠',ch:2,
 q:'休眠期の樹が寒さに耐えるためのエネルギー源として根・幹に蓄積している物質は、主に___である。',en:'What substance does the vine primarily store in its roots and trunk to provide energy reserves through the dormant period?',
 ans:'炭水化物（デンプンなど／carbohydrates）',alt:['炭水化物','デンプン','carbohydrate','carbohydrates','starch'],
 exp:`休眠期の樹は、収穫後から落葉までの間に光合成で作った炭水化物（デンプンなど）を根や幹に蓄積している。これが冬の間のエネルギー源となり、また春に気温が上昇した際の急速な萌芽・新梢成長を支える土台となる。${DORMANCY_SVG}<div class="page-ref">${p('10, 13','2.1 / 2.5')}</div>`},

{type:'tf',cat:'老化と休眠',ch:2,
 q:'休眠期の長さや深さは、品種や気候によって異なることがある。',en:'The length and depth of dormancy can vary depending on variety and climate.',
 ans:true,
 exp:`正しい。休眠の長さ・深さは品種固有の特性や、その年・その産地の気候条件によって変動する。これは生育サイクル全体の進行スピードや、翌年の萌芽のタイミングにも影響を与える。<div class="page-ref">${p('10, 13','2.1 / 2.5')}</div>`},
// ========== Chapter 2: 花の構造と受粉のしくみ ==========
{type:'mc',cat:'花の構造と受粉',ch:2,
 q:'ブドウの花において、花粉を作る器官（雄性器官）の名称として正しいものはどれか？',en:'What is the name of the male reproductive organ that produces pollen in the grapevine flower?',
 opts:['雌しべ（pistil）','雄しべ（stamen）','子房（ovary）','柱頭（stigma）'],ans:1,
 exp:`雄しべ(stamen)＝花糸(filament)の先端に葯(anther)を持つ雄性器官で、葯の中で花粉が作られる。雌性器官である雌しべ(pistil)とともに、ブドウの両性花を構成する。${FLOWER_SVG}<div class="page-ref">${p('11','2.2 From Budburst to Flowering')}</div>`},

{type:'fill',cat:'花の構造と受粉',ch:2,
 q:'雄しべの先端にあり、花粉が作られる部分を___という。',en:'What is the name of the part at the tip of the stamen where pollen is produced?',
 ans:'葯（やく／anther）',alt:['葯','anther','やく'],
 exp:`葯(anther)は雄しべの先端部分で、花粉(pollen)が作られる場所。葯は花糸(filament)という柄の先端についており、開花時に花粉を放出して雌しべの柱頭へと届ける。${FLOWER_SVG}<div class="page-ref">${p('11','2.2 From Budburst to Flowering')}</div>`},

{type:'fill',cat:'花の構造と受粉',ch:2,
 q:'葯を支える柄状の部分を___という。',en:'What is the name of the stalk that supports the anther?',
 ans:'花糸（かし／filament）',alt:['花糸','filament','かし'],
 exp:`花糸(filament)は葯(anther)を支える細い柄状の構造。葯と花糸を合わせて雄しべ(stamen)を構成する。${FLOWER_SVG}<div class="page-ref">${p('11','2.2 From Budburst to Flowering')}</div>`},

{type:'order',cat:'花の構造と受粉',ch:2,
 q:'雌しべ（雌性器官）を構成する部位を、花粉が最初に到達する場所から胚珠に至るまでの順に並べてください。',en:'Arrange the parts of the pistil in the order pollen encounters them, from the point of first contact to the ovule.',
 items:['柱頭（stigma）','花柱（style）','子房（ovary）と胚珠（ovule）'],
 ans:[0,1,2],
 exp:`花粉はまず柱頭(stigma)に付着し（受粉）、続いて花柱(style)を貫くように花粉管を伸ばし、最終的に子房(ovary)内の胚珠(ovule)に到達して受精(fertilisation)が成立する。${FLOWER_SVG}<div class="page-ref">${p('11','2.2 From Budburst to Flowering')}</div>`},

{type:'mc',cat:'花の構造と受粉',ch:2,
 q:'子房（ovary）の中に含まれ、受精後に種子へと発達する構造の名称はどれか？',en:'What is the name of the structure inside the ovary that develops into a seed after fertilisation?',
 opts:['花粉（pollen）','胚珠（ovule）','柱頭（stigma）','花糸（filament）'],ans:1,
 exp:`胚珠(ovule)は子房(ovary)内に存在する構造で、受精後に発達して種子(seed)となる。受精には、花粉管が柱頭から花柱を経て胚珠まで到達する必要がある。${FLOWER_SVG}<div class="page-ref">${p('11','2.2 From Budburst to Flowering')}</div>`},

{type:'mc',cat:'花の構造と受粉',ch:2,
 q:'ブドウの花が「両性花（自家受粉が可能）」であることに加えて、開花期の自家受粉を助ける要因として考えられるものはどれか？',en:'Besides being hermaphrodite, what factor helps grapevine flowers achieve self-pollination during flowering?',
 opts:['花が大きく目立つため昆虫が集まりやすい','雄しべと雌しべが同じ花の中で近接して配置されているため、花粉が柱頭に届きやすい','花の色が鮮やかで風媒に有利だから','花弁が大きく開いて長期間維持されるから'],ans:1,
 exp:`ブドウの花は両性花であり、雄しべと雌しべが同じ花の中で近接して配置されているため、キャリプトラが脱落して花が開いた直後に花粉が柱頭へ届きやすい構造になっている。これにより、昆虫や風による他家受粉に大きく依存せずとも、安定した自家受粉が可能になる。${FLOWER_SVG}<div class="page-ref">${p('11','2.2 From Budburst to Flowering')}</div>`},

{type:'tf',cat:'花の構造と受粉',ch:2,
 q:'花粉が柱頭に付着すること（受粉）と、花粉管が胚珠に到達すること（受精）は同じ現象を指す。',en:'Pollination (pollen landing on the stigma) and fertilisation (the pollen tube reaching the ovule) refer to the same event.',
 ans:false,
 exp:`誤り。受粉(pollination)は花粉が柱頭に付着する段階を指し、受精(fertilisation)は花粉管が花柱を通って胚珠に到達し、実際に受精が成立する段階を指す。受粉した花のすべてが受精・結実に至るわけではなく、両者は明確に区別される。<div class="compare-table"><table><tr><th>用語</th><th>内容</th></tr><tr><td>受粉 pollination</td><td>花粉が柱頭(stigma)に付着すること</td></tr><tr><td>受精 fertilisation</td><td>花粉管が胚珠(ovule)に到達し受精が成立すること</td></tr><tr><td>結実 fruit set</td><td>受精した花が果粒へと成長を始めること</td></tr></table></div><div class="page-ref">${p('11','2.2 From Budburst to Flowering')}</div>`},

{type:'mc',cat:'花の構造と受粉',ch:2,
 q:'開花期に「キャリプトラ（花冠帽）」が脱落した直後に起こることとして、最も適切なのはどれか？',en:'What is most likely to happen immediately after the calyptra falls away at flowering?',
 opts:['果実がただちに成熟を始める','雄しべ・雌しべが露出し、花粉が放出されて受粉が始まる','樹はただちに休眠期に入る','葉がすべて落葉する'],ans:1,
 exp:`キャリプトラが脱落すると、それまで保護されていた雄しべ・雌しべが露出し、葯から花粉が放出されて柱頭に付着する受粉のプロセスが始まる。これが結実、ひいては果実の発達全体の出発点となる。${FLOWER_SVG}<div class="page-ref">${p('11','2.2 From Budburst to Flowering')}</div>`},

{type:'multi',cat:'花の構造と受粉',ch:2,
 q:'雄しべ（stamen）を構成する要素を2つ選んでください。',en:'Select the two structures that together make up the stamen.',
 opts:['葯（anther）','花糸（filament）','柱頭（stigma）','子房（ovary）'],ans:[0,1],
 exp:`雄しべ(stamen)は、花粉を作る葯(anther)と、それを支える花糸(filament)から構成される。柱頭(stigma)・子房(ovary)は雌しべ(pistil)を構成する要素であり、雄しべには含まれない。${FLOWER_SVG}<div class="page-ref">${p('11','2.2 From Budburst to Flowering')}</div>`},

{type:'vocab',cat:'花の構造と受粉',ch:2,
 q:'「胚珠」を英語で言うと？',en:'What is the English term for「胚珠」?',
 opts:['Stigma','Anther','Ovule','Filament'],ans:2,
 exp:`Ovule（胚珠）＝子房内にあり、受精後に種子へと発達する構造。Stigma＝柱頭、Anther＝葯、Filament＝花糸。${FLOWER_SVG}<div class="page-ref">${p('11','2.2 From Budburst to Flowering')}</div>`},
// ========== Chapter 2: 果実(果粒・果房)の発達と構造 ==========
{type:'mc',cat:'果実の発達と構造',ch:2,
 q:'熟したブドウの果粒（berry）を構成する主な部分の組み合わせとして正しいものはどれか？',en:'Which combination correctly lists the main parts that make up a ripe grape berry?',
 opts:['果皮（skin）・果肉（pulp/flesh）・種子（seeds）','花弁（petal）・花糸（filament）・葯（anther）','木部（xylem）・師部（phloem）・形成層（cambium）','主幹（trunk）・コルドン（cordon）・新梢（shoot）'],ans:0,
 exp:`果粒(berry)は大きく分けて、色素やタンニン、香り化合物を多く含む果皮(skin)、糖や酸、水分の大部分を含む果肉(pulp/flesh)、そしてタンニンや油分を含む種子(seeds)から構成される。これらの構成比やバランスは、ワインのスタイルや品質に大きく関わる。<div class="page-ref">${p('11–12','2.3 From Fruit Set to Ripening')}</div>`},

{type:'mc',cat:'果実の発達と構造',ch:2,
 q:'果皮（skin）に多く含まれる成分として適切な組み合わせはどれか？',en:'Which group of compounds is concentrated mainly in the grape skin?',
 opts:['色素（アントシアニンなど）・タンニン・香り化合物','糖分のほぼすべて','水分のほぼすべて','種子に特有の油分'],ans:0,
 exp:`果皮には色素（黒ブドウのアントシアニンなど）、タンニン、そして多くの香り化合物（前駆体を含む）が集中して存在する。これは醸造において、果皮との接触時間（マセラシオン）がワインの色・タンニン・香りの強さを左右する理由でもある。<div class="page-ref">${p('11–12','2.3 From Fruit Set to Ripening')}</div>`},

{type:'tf',cat:'果実の発達と構造',ch:2,
 q:'果粒の中で糖分や酸の大部分を含むのは、果皮ではなく果肉（pulp）である。',en:'Most of a berry’s sugars and acids are found in the pulp (flesh) rather than the skin.',
 ans:true,
 exp:`正しい。果肉(pulp/flesh)には水分とともに糖分・酸の大部分が含まれている。果皮は色素・タンニン・香り化合物が集中する部位であり、構成成分の分布が部位ごとに大きく異なる点がブドウの果実の特徴。<div class="compare-table"><table><tr><th>部位</th><th>主な成分</th></tr><tr><td>果皮 skin</td><td>色素・タンニン・香り化合物</td></tr><tr><td>果肉 pulp/flesh</td><td>水分・糖分・酸の大部分</td></tr><tr><td>種子 seeds</td><td>タンニン・油分</td></tr></table></div><div class="page-ref">${p('11–12','2.3 From Fruit Set to Ripening')}</div>`},

{type:'mc',cat:'果実の発達と構造',ch:2,
 q:'種子（seeds）に多く含まれる成分として適切なものはどれか？',en:'Which compounds are found in relatively high concentrations in grape seeds?',
 opts:['アントシアニン（色素）のみ','タンニンと油分','メトキシピラジン','糖分の大部分'],ans:1,
 exp:`種子(seeds)にはタンニンや油分が多く含まれる。種子由来のタンニンは果皮由来のものに比べて粗く渋みが強い傾向があり、未熟な種子を強く圧搾するとワインに苦味・収斂味をもたらすことがあるため、醸造ではプレスの強さに注意が払われる。<div class="page-ref">${p('11–12','2.3 From Fruit Set to Ripening')}</div>`},

{type:'mc',cat:'果実の発達と構造',ch:2,
 q:'同じ品種でも、果粒が小さいほどワインの個性として強く出やすい傾向にあるとされる理由として最も適切な説明はどれか？',en:'Why are smaller berries often associated with more concentrated wine character?',
 opts:['果粒が小さいほど糖度が必ず低くなるため','果実全体に対する果皮の表面積比率が大きくなり、色素・タンニン・香り成分の割合が相対的に高まるため','果粒が小さいほど種子の数が減るため','果粒が小さいほど収量が増えるため'],ans:1,
 exp:`果粒が小さいと、果実の体積（＝果肉の量）に対して果皮の表面積の比率が相対的に大きくなる。果皮には色素・タンニン・香り化合物が集中しているため、小粒の果実から造られるワインは色や風味が濃く凝縮した印象になりやすいとされる。<div class="mnemonic">🧠 小粒＝皮の割合大→ 色・タンニン・香りが「濃縮」される</div><div class="page-ref">${p('11–12','2.3 From Fruit Set to Ripening')}</div>`},

{type:'fill',cat:'果実の発達と構造',ch:2,
 q:'複数の果粒がまとまって付いている房状の構造を___という。',en:'What is the term for the cluster structure on which individual berries are attached?',
 ans:'果房（かぼう／bunch）',alt:['果房','房','bunch','cluster'],
 exp:`果房(bunch/cluster)は、果梗(stem)から枝分かれした構造に複数の果粒(berries)が付いた房状の構造。果房の大きさ・密度（果粒の詰まり方）は、品種や栽培条件によって異なり、病害リスク（密集した房は灰色かび病等が広がりやすい）にも関わる。${FRUITSET_SVG}<div class="page-ref">${p('11','2.3 From Fruit Set to Ripening')}</div>`},

{type:'mc',cat:'果実の発達と構造',ch:2,
 q:'果房が密集している（berries が密に詰まっている）場合に生じやすいリスクとして適切なものはどれか？',en:'What risk is associated with tightly packed (compact) bunches?',
 opts:['日照を受けやすくなり成熟が早まる','果粒同士が密着し、灰色かび病など果房の腐敗リスクが高まる','収量が必ず減少する','果皮が厚くなる'],ans:1,
 exp:`果粒が密に詰まった果房は、果粒同士が密着することで湿気がこもりやすく、灰色かび病(grey rot/botrytis)などの腐敗リスクが高まる。栽培者は、葉やシュートの管理（キャノピーマネジメント）によって果房周りの通気性を確保し、こうしたリスクを抑える工夫を行う。<div class="page-ref">${p('11','2.3 From Fruit Set to Ripening')}</div>`},

{type:'mc',cat:'果実の発達と構造',ch:2,
 q:'果実が日光に十分に当たることで促進される変化として適切な組み合わせはどれか？',en:'Which combination of changes is promoted by adequate sunlight exposure on the fruit?',
 opts:['糖度の上昇とメトキシピラジン（青臭い香り）の減少','酸度の上昇のみ','タンニンの減少のみ','果粒のサイズの縮小のみ'],ans:0,
 exp:`果実が十分な日光を受けることで光合成産物（糖）の供給が促され糖度上昇につながるとともに、未熟な香りの原因となるメトキシピラジン類の分解・減少も進みやすくなる。これが、キャノピーマネジメントで果房周りの日当たりを調整する理由の一つ。<div class="page-ref">${p('12','2.4 Ripening')}</div>`},

{type:'tf',cat:'果実の発達と構造',ch:2,
 q:'果粒の大きさや果房の構造は、ワインの色合いや風味の濃淡に影響を与えうる。',en:'Berry size and bunch structure can influence the depth of colour and flavour intensity in the resulting wine.',
 ans:true,
 exp:`正しい。果粒が小さいほど果皮の比率が高まり色・タンニン・香りが濃縮されやすく、また果房の密度は腐敗リスクや均一な成熟のしやすさに関わる。これらは栽培管理（房の調整・摘房など）を通じて、目指すワインのスタイルに合わせてコントロールされることがある。<div class="page-ref">${p('11–12','2.3 From Fruit Set to Ripening')}</div>`},

{type:'mc',cat:'果実の発達と構造',ch:2,
 q:'結実時に受精に至らなかった、または成長の途中で発育が止まった果粒は、最終的な果房の中でどのような状態になりやすいか？',en:'What typically happens to berries that fail to be fertilised, or whose development is arrested?',
 opts:['他の果粒よりも著しく大きく成長する','小さいまま留まる、または房から脱落する（ミルランダージュやコゥルーレと関連）','色だけが濃く変化する','種子の数だけが増加する'],ans:1,
 exp:`受精に至らなかった、または発育が途中で止まった果粒は小さいまま留まったり、房から脱落したりする。これは結実不良（ミルランダージュやコゥルーレ）と関連する現象で、最終的な果房の構造（果粒の大きさのばらつきや密度）に影響する。<div class="page-ref">${p('11','2.2–2.3')}</div>`},
// ========== Chapter 2: 気候・気象とサイクルへの影響 ==========
{type:'mc',cat:'気候と生育サイクル',ch:2,
 q:'ある産地で、年によって生育サイクルの進行スピードが異なる主な理由として最も適切なものはどれか？',en:'What is the main reason the pace of the growth cycle differs from year to year in a given region?',
 opts:['毎年異なる品種を植え替えているから','その年の気象条件（特に気温の推移）が生育の各段階の進行速度に影響するため','収穫機の性能が年々向上しているため','土壌の種類が毎年変化するため'],ans:1,
 exp:`同じ産地・同じ品種であっても、その年の気象条件（特に気温の推移）によって生育サイクルの進行スピードは変動する。気温が高めに推移した年は各段階が早く進み「早摘み」の年に、低めに推移した年は遅く進み「遅摘み」の年になりやすい。これが「ヴィンテージ（年による違い）」が生まれる大きな要因の一つ。<div class="page-ref">${p('10–13','2.1–2.5')}</div>`},

{type:'fill',cat:'気候と生育サイクル',ch:2,
 q:'同じ産地・同じ品種であっても、その年の気象条件によってブドウの出来や収穫時期が異なることを___という。',en:'What term describes the year-to-year variation in grape characteristics and harvest timing caused by differing weather conditions?',
 ans:'ヴィンテージ（年による違い／vintage variation）',alt:['ヴィンテージ','vintage variation','年による違い'],
 exp:`同じ畑・同じ品種であっても、その年の気象条件によって生育の進行や果実の出来、収穫時期が変わることを「ヴィンテージ（年差・vintage variation）」という。冷涼産地ほどこの年差の影響を受けやすい傾向がある。<div class="page-ref">${p('10–13','2.1–2.5')}</div>`},

{type:'mc',cat:'気候と生育サイクル',ch:2,
 q:'生育期間（growing season）が長く確保できる産地で期待できる傾向として、最も適切なものはどれか？',en:'What is generally expected in regions where the growing season is long enough to allow it?',
 opts:['果実が複雑な風味成分を発達させる時間を十分に確保しやすい','遅霜のリスクが完全になくなる','ベレゾーンが起こらなくなる','すべての品種が同じ収穫日になる'],ans:0,
 exp:`生育期間が十分に長く確保できると、果実は糖・酸・タンニン・香味成分などをじっくりと発達させる時間を持つことができ、複雑でバランスの取れた成熟に至りやすくなる。生育期間の長さは、気候帯や品種選定とも密接に関わる重要な要素。<div class="page-ref">${p('10–13','2.1–2.5')}</div>`},

{type:'mc',cat:'気候と生育サイクル',ch:2,
 q:'冷涼な気候の産地で、温暖な産地と比べて生育サイクル全体に見られやすい傾向はどれか？',en:'Compared with warmer regions, what tendency is often seen in the growth cycle in cooler-climate regions?',
 opts:['生育サイクル全体がより速く進行する','各段階の進行がよりゆっくりで、糖度の蓄積も穏やかになりやすい','休眠期がなくなる','果実が日光を必要としなくなる'],ans:1,
 exp:`冷涼な気候の産地では、各生育段階の進行が温暖な産地に比べてゆっくりになりやすく、糖度の蓄積も穏やかに進む傾向がある。これにより、酸が比較的多く保たれた、フレッシュでエレガントなスタイルのブドウが得られやすいとされる。<div class="page-ref">${p('10–13','2.1–2.5')}</div>`},

{type:'multi',cat:'気候と生育サイクル',ch:2,
 q:'生育サイクルの異なる段階で、それぞれ異なる気象リスクが懸念される。「萌芽期」と「収穫期」それぞれで特に警戒される気象リスクの組み合わせとして適切なものを選んでください（2つ）。',en:'Select the two weather-related risks that are most closely associated with budburst and harvest time respectively.',
 opts:['萌芽期：遅霜による新芽への被害','萌芽期：高温による過熟','収穫期：降雨による果実の腐敗・希釈','収穫期：低温による休眠不全'],ans:[0,2],
 exp:`萌芽期は柔らかい新芽が遅霜の被害を受けやすく、収穫期は降雨が果実の腐敗や水分による希釈（凝縮度の低下）を招きやすい。生育サイクルの各段階で警戒すべき気象リスクは異なり、栽培者は年間を通じて天候を注視しながら対策を講じる。<div class="compare-table"><table><tr><th>段階</th><th>主な気象リスク</th></tr><tr><td>萌芽期</td><td>遅霜による新芽の被害</td></tr><tr><td>開花期</td><td>低温・多雨によるコゥルーレ／ミルランダージュ</td></tr><tr><td>成熟期〜収穫期</td><td>降雨による腐敗・希釈、ひょう害など</td></tr></table></div><div class="page-ref">${p('10–13','2.1–2.5')}</div>`},

{type:'tf',cat:'気候と生育サイクル',ch:2,
 q:'北半球と南半球では、ブドウ樹の生育サイクルが「逆の季節」で進行するため、収穫の時期（カレンダー上の月）も大きく異なる。',en:'Because the growth cycle runs in opposite seasons in the northern and southern hemispheres, harvest times (calendar months) differ significantly between the two.',
 ans:true,
 exp:`正しい。北半球では収穫が秋（おおよそ8〜10月）に行われる地域が多いのに対し、南半球では季節が逆になるため、同じ生育段階が約6か月ずれて、収穫はおおよそ2〜4月頃に行われることが多い。サイクルの「順序」は同じだが、暦の上でのタイミングが大きく異なる点に注意。<div class="page-ref">${p('10','2.1 The Annual Growth Cycle')}</div>`},

{type:'mc',cat:'気候と生育サイクル',ch:2,
 q:'ある産地で、特定の年に「開花が例年より早く始まった」という記録がある場合、その後の生育サイクルにどのような傾向が予想されやすいか？',en:'If flowering begins earlier than usual in a particular year, what tendency would you expect for the rest of that year’s cycle?',
 opts:['その後の段階（結実・ベレゾーン・収穫）も前倒しで進みやすい','その後の段階の進行速度には影響しない','収穫だけが遅れる','休眠期が長引く'],ans:0,
 exp:`生育サイクルは連続したプロセスであるため、ある段階が早く始まれば、その後に続く段階（結実・ベレゾーン・収穫）も連動して前倒しで進みやすい。逆に、ある段階で遅れが生じれば、それ以降も遅れが連鎖しやすい。各段階は独立しているのではなく、互いに連動している点を理解することが重要。<div class="page-ref">${p('10–13','2.1–2.5')}</div>`},

{type:'mc',cat:'気候と生育サイクル',ch:2,
 q:'栽培者が年間の気象リスクに備えて講じる対策の例として、最も適切な組み合わせはどれか？',en:'Which combination best illustrates measures growers take to manage weather-related risks across the year?',
 opts:['霜害対策（散水・防霜ファンなど）と防鳥ネットの設置のみ','遅霜対策（散水・送風機等）、開花期の天候への配慮、収穫前の降雨予報の確認など、段階ごとに異なる対策を講じる','収穫時期をワインの種類に関わらず常に同じ日に固定する','気象条件に関係なく、毎年同じ量の化学肥料を投入する'],ans:1,
 exp:`栽培者は、生育サイクルの各段階で異なるリスクに対応するため、萌芽期の遅霜対策（散水・防霜ファン・燃焼など）、開花期の天候への配慮、収穫前後の降雨予報の確認といった、段階ごとに異なる対策を講じる。これは「年間を通じたリスクマネジメント」として栽培の重要な一部をなす。<div class="page-ref">${p('10–13','2.1–2.5')}</div>`},

{type:'tf',cat:'気候と生育サイクル',ch:2,
 q:'生育サイクルの長さや各段階の進行速度を理解することは、ワイン産地ごとのスタイルの違いを理解する手がかりになる。',en:'Understanding the length of the growth cycle and the pace of its stages helps explain why wine styles differ from region to region.',
 ans:true,
 exp:`正しい。生育サイクルの進行スピードや各段階の長さは気候によって変わり、それが糖度・酸度・タンニンの成熟バランスに直結する。これはワインのアルコール度数、酸味の強さ、ボディ、風味の傾向など、産地ごとのスタイルの違いを理解する重要な手がかりとなる。<div class="mnemonic">🧠 サイクルを制する者はスタイルを制す→ 生育サイクル理解は産地スタイル理解の土台</div><div class="page-ref">${p('10–13','2.1–2.5')}</div>`},
// ========== Chapter 2: 複合・応用（章全体の統合問題） ==========
{type:'mc',cat:'複合・応用',ch:2,
 q:'ある栽培者が「今年は開花が早く、その後も天候が安定して気温が高めに推移した」と話している。この場合、収穫時期や果実の特徴について最も妥当な推測はどれか？',en:'A grower reports that flowering started early this year and warm, stable weather has continued since. What is the most reasonable inference about harvest timing and fruit characteristics?',
 opts:['収穫は例年より早まり、糖度が高く酸度が低めの果実になりやすい','収穫は例年より遅れ、酸度が非常に高い果実になる','生育サイクルへの影響はなく、例年通りになる','果実は色づかないまま収穫を迎える'],ans:0,
 exp:`開花が早く始まり、その後も気温が高めで安定して推移した場合、生育サイクル全体が前倒しで進行しやすく、結果として収穫も早まりやすい。気温が高い条件では呼吸による酸の消費が進みやすく、糖度上昇とともに酸度が低下した果実になりやすい（いわゆる「温暖な年」のパターン）。${RIPENING_CURVE_SVG}<div class="page-ref">${p('10–13','2.1–2.5')}</div>`},

{type:'mc',cat:'複合・応用',ch:2,
 q:'休眠期に樹が根や幹に蓄えた炭水化物は、生育サイクルのどの段階で特に重要な役割を果たすか？',en:'At which stage of the cycle do the carbohydrate reserves stored in the roots and trunk during dormancy play an especially important role?',
 opts:['休眠期そのものの間だけ','萌芽から開花にかけての急速な栄養成長の初期','収穫直後の老化期','ベレゾーンの瞬間のみ'],ans:1,
 exp:`休眠期に蓄えられた炭水化物（デンプンなど）は、まだ葉が十分に展開しておらず光合成による栄養供給が少ない、萌芽から開花にかけての急速な栄養成長の初期段階で特に重要なエネルギー源となる。葉が十分に育つと、樹はそれ以降、光合成による栄養供給に移行していく。<div class="page-ref">${p('10–11','2.1–2.2')}</div>`},

{type:'mc',cat:'複合・応用',ch:2,
 q:'「萌芽期の遅霜」「開花期の低温・多雨」「収穫期の降雨」という3つの気象リスクに共通する特徴として最も適切なものはどれか？',en:'What do "late frost at budburst," "cold/wet weather at flowering," and "rain at harvest" have in common?',
 opts:['いずれも収量や品質に直接影響しうる、生育サイクル上の重要な転換点で発生するリスクである','いずれも気温の低下とは無関係である','いずれも栽培者には対策のしようがない','いずれもベレゾーン後にのみ発生するリスクである'],ans:0,
 exp:`これら3つはいずれも、生育サイクルの重要な転換点（萌芽・開花・収穫）で発生し、結実数や果実の健全性、ひいては収量・品質に直接的な影響を与えうる気象リスクである。栽培者はこれらのタイミングを見越して、防霜・防除・収穫判断などの対策を講じる。<div class="page-ref">${p('10–13','2.1–2.5')}</div>`},

{type:'order',cat:'複合・応用',ch:2,
 q:'以下の現象を、生育サイクルの中で発生する順序に並べてください。',en:'Place the following phenomena in the order they occur within the annual growth cycle.',
 items:['樹液の動き出し（bleeding）','コゥルーレ（結実不良）の発生リスクが高まる時期','ラグフェーズ（果実成長の停滞期）','色素の蓄積とアントシアニンの増加（ベレゾーン以降）'],
 ans:[0,1,2,3],
 exp:`これらは「①樹液が動き出す（休眠の終わり）→②開花期（コゥルーレのリスクが高まる）→③結実後のラグフェーズ→④ベレゾーン以降の色素蓄積」という順に発生する。各現象がサイクルのどの段階に位置するかを把握することは、章全体を俯瞰する鍵となる。${CYCLE_WHEEL_SVG}<div class="page-ref">${p('10–13','2.1–2.5')}</div>`},

{type:'mc',cat:'複合・応用',ch:2,
 q:'ある冷涼産地で、「成熟期に十分な日照時間と適度な気温が確保できなかった」場合に予想される果実の特徴として、最も妥当なものはどれか？',en:'In a cool-climate region where the ripening period lacked sufficient sunlight and warmth, what fruit characteristics would you expect?',
 opts:['糖度が高く、メトキシピラジン由来の青臭い香りも少ない、完熟した果実になる','糖度が低めで、酸度は高く保たれ、メトキシピラジン由来の青臭い香りが残りやすい','果実の成長が完全に停止し、結実もしない','タンニンの量だけが極端に増加する'],ans:1,
 exp:`成熟期に十分な日照と気温が確保できないと、糖度の蓄積が進みにくく、酸の消費（呼吸）も穏やかになるため酸度が高めに残りやすい。また、メトキシピラジン類の分解も進みにくいため、青臭い香りが残りやすくなる。これは「不十分な成熟（under-ripeness）」の典型的な特徴。<div class="page-ref">${p('12–13','2.4 Ripening')}</div>`},

{type:'tf',cat:'複合・応用',ch:2,
 q:'果実の成熟は「糖度の上昇」という単一の指標だけでなく、酸度・タンニン・色素・香味成分など複数の要素が連動して進行するプロセスであり、これらの理解は栽培・収穫判断の両方に役立つ。',en:'Ripening is a multi-faceted process involving sugar, acid, tannin, colour, and aroma compounds together — understanding this helps with both viticultural decisions and harvest timing.',
 ans:true,
 exp:`正しい。成熟は単一の指標で測れるものではなく、糖度・酸度・タンニンの質・色素・香味成分の発達など複数の要素が連動して進行する複合的なプロセス。これを理解することは、栽培管理（葉や房の調整など）や収穫タイミングの判断において欠かせない視点となる。<div class="mnemonic">🧠 成熟＝オーケストラ→ 糖・酸・タンニン・色・香りが「揃って」初めて良い「演奏」になる</div><div class="page-ref">${p('11–13','2.3–2.4')}</div>`},

{type:'mc',cat:'複合・応用',ch:2,
 q:'生育サイクルにおける「樹のエネルギー配分の変化」を最もよく説明している記述はどれか？',en:'Which statement best explains how the vine’s allocation of energy shifts over the course of the annual cycle?',
 opts:['年間を通じて常に同じ割合で栄養成長と生殖成長にエネルギーを配分する','萌芽〜開花期は栄養成長（シュート・葉）中心、ベレゾーン以降は生殖成長（果実の成熟）中心へと重点が移っていく','休眠期から収穫期まで、エネルギーは常に果実にのみ向けられる','エネルギー配分は天候に関係なく毎年固定されている'],ans:1,
 exp:`生育サイクルの前半（萌芽〜開花期）は新梢や葉を成長させる栄養成長にエネルギーが多く配分され、サイクルが進むにつれて果実の発達・成熟（生殖成長）への配分が増えていく。この「エネルギー配分の移行」を理解することは、各段階で起こる変化の背景を説明する鍵となる。${SHOOT_GROWTH_SVG}<div class="page-ref">${p('10–13','2.1–2.5')}</div>`},

{type:'mc',cat:'複合・応用',ch:2,
 q:'次のうち、「結実不良」に関連する2つの現象（コゥルーレとミルランダージュ）に共通する背景として最も適切なものはどれか？',en:'What common underlying cause links coulure and millerandage, the two phenomena associated with poor fruit set?',
 opts:['いずれも収穫期の高温が原因である','いずれも開花期の不順な天候（低温・多雨・強風など）が受精や結実のプロセスを妨げることに関連する','いずれも休眠期の気温に起因する','いずれも土壌の酸性度のみに起因する'],ans:1,
 exp:`コゥルーレ（結実数の大幅な減少）とミルランダージュ（房内で果粒の大きさが不揃いになる現象）は、いずれも開花期の不順な天候（低温・多雨・強風など）が受精・結実のプロセスを妨げることに関連して発生する。原因（開花期の悪天候）は共通だが、現れ方（結実数の減少か、果粒サイズのばらつきか）が異なる点に注意。<div class="page-ref">${p('11','2.2 From Budburst to Flowering')}</div>`},

{type:'fill',cat:'複合・応用',ch:2,
 q:'ブドウ樹の年間生育サイクルにおいて、「気温の上昇が引き金となって始まり、気温の低下とともに終わる」という一連の流れを総称して___と呼ぶ。',en:'What general term describes the entire sequence that begins when temperatures rise and ends as temperatures fall, encompassing dormancy through to the next dormancy?',
 ans:'年間生育サイクル（annual growth cycle）',alt:['年間生育サイクル','annual growth cycle','生育サイクル'],
 exp:`年間生育サイクル(annual growth cycle)は、休眠から目覚め（気温上昇による樹液の動き出し・萌芽）、開花・結実・成熟・収穫を経て、再び気温の低下とともに老化・落葉・休眠へと至る、毎年繰り返される一連の流れ全体を指す。${CYCLE_WHEEL_SVG}<div class="page-ref">${p('10','2.1 The Annual Growth Cycle')}</div>`},

{type:'multi',cat:'複合・応用',ch:2,
 q:'章全体を振り返り、「気温」がブドウ樹に与える影響として正しいものを2つ選んでください。',en:'Reflecting on the whole chapter, select two ways in which temperature influences the grapevine.',
 opts:['休眠から目覚めるタイミング（樹液の動き出し・萌芽）に影響する','成熟期の糖度上昇・酸度低下のスピードに影響する','果粒の中の種子の数を直接決定する','花の色を決定づける唯一の要因である'],ans:[0,1],
 exp:`気温は、休眠から目覚めるタイミング（約10℃が目安となる樹液の動き出しや萌芽）と、成熟期における糖度上昇・酸度低下の進み方（呼吸による酸の消費速度など）の両方に大きく影響する。種子の数や花の色は、気温だけでなく品種特性や受精の成否など複数の要因によって決まる。<div class="page-ref">${p('10–13','2.1–2.5')}</div>`},

{type:'mc',cat:'複合・応用',ch:2,
 q:'第2章で扱った「ブドウ樹の年間生育サイクル」の理解が、ワインの学習全体にとって重要である理由として、最も適切な説明はどれか？',en:'Why is understanding the annual growth cycle, covered in this chapter, important to the broader study of wine?',
 opts:['品種名を覚えるためだけに必要な知識だから','気候や栽培条件が果実の成熟や成分バランスに与える影響を理解する土台となり、産地・ヴィンテージ・スタイルの違いを説明する基礎になるから','収穫機の操作方法を学ぶ前提として必要だから','ラベル表示regulationsを暗記するために必要だから'],ans:1,
 exp:`生育サイクルの理解は、気候や栽培条件が果実の成熟（糖・酸・タンニン・香味成分のバランス）にどう影響するかを理解する土台となる。これは、産地ごとの気候特性、ヴィンテージ（年差）、ワインスタイルの違いを説明する際の基礎知識として、WSETの学習全体を通じて繰り返し活用される重要な視点である。<div class="mnemonic">🧠 生育サイクル＝ワイン学習の「土台」→ ここを理解すれば気候・産地・ヴィンテージの話がすべて繋がる</div><div class="page-ref">${p('10–13','全章')}</div>`},


];

function getAnswerText(q){
  const lb=['A','B','C','D','E','F','G'];
  if(q.type==='mc'||q.type==='vocab'){
    return {label:'正解', val: lb[q.ans]+'．'+q.opts[q.ans], opts: q.opts};
  } else if(q.type==='tf'){
    return {label:'正解', val: q.ans ? '○ True（正しい）' : '✕ False（誤り）'};
  } else if(q.type==='fill'){
    return {label:'答え', val: q.ans};
  } else if(q.type==='order'){
    return {label:'正しい順番', val: q.ans.map((i,n)=>(n+1)+'. '+q.items[i]).join(' → ')};
  } else if(q.type==='multi'){
    const lb2=['A','B','C','D','E','F','G'];
    return {label:'正解（複数）', val: q.ans.map(i=>lb2[i]+'．'+q.opts[i]).join('、')};
  }
  return {label:'答え', val:'-'};
}

const SK = 'wset_d1_'; // storage prefix

function save(key, val){ try{ localStorage.setItem(SK+key, JSON.stringify(val)); }catch(e){} }
function load(key, def){ try{ const v=localStorage.getItem(SK+key); return v!=null?JSON.parse(v):def; }catch(e){return def;} }
function del(key){ try{ localStorage.removeItem(SK+key); }catch(e){} }

// ---- SRS: 間隔反復スケジュール ----
// wrongLog: { qIndex: { due: timestamp, interval: days, ease: float, reps: int } }
function getWrongLog(){ return load('srs',{}); }
function saveWrongLog(log){ save('srs',log); }

// ease factor: 2.5 default, min 1.3
// SM-2 simplified
function updateSRS(qIdx, correct){
  const log = getWrongLog();
  const now = Date.now();
  const e = log[qIdx] || {due:now, interval:1, ease:2.5, reps:0};
  if(correct){
    e.reps++;
    if(e.reps===1) e.interval=1;
    else if(e.reps===2) e.interval=6;
    else e.interval = Math.round(e.interval * e.ease);
    e.ease = Math.max(1.3, e.ease + 0.1);
  } else {
    e.reps=0; e.interval=1; e.ease=Math.max(1.3, e.ease-0.2);
  }
  e.due = now + e.interval * 86400000;
  log[qIdx] = e;
  saveWrongLog(log);
}

function getWrongList(){ return load('wrong',[]); }
function addToWrong(qIdx){
  const w = getWrongList();
  if(!w.includes(qIdx)) w.push(qIdx);
  save('wrong', w);
}
function removeFromWrong(qIdx){
  const w = getWrongList().filter(i=>i!==qIdx);
  save('wrong', w);
}
function clearWrongList(){ del('wrong'); }

// ---- 進捗保存 ----
function saveProgress(){
  if(!sessionKey) return;
  const state = {
    sessionKey,
    deckIds: deck.map(q=>ALL.indexOf(q)),
    cur, score,
    wrongIds: [...wrongIds],
    savedAt: Date.now()
  };
  // Save per-session-key: 'prog_all', 'prog_クローンと選抜', etc.
  const key = 'prog_' + sessionKey;
  save(key, state);
}
function loadProgress(key){
  if(key) return load('prog_' + key, null);
  // Legacy fallback
  return load('progress', null);
}
function clearProgress(key){
  if(key) del('prog_' + key);
  else {
    // Clear all prog_ keys
    try {
      Object.keys(localStorage).filter(k=>k.startsWith('wset_d1_prog_')).forEach(k=>localStorage.removeItem(k));
      del('progress');
    } catch(e){}
  }
}
function getAllProgress(){
  const validKeys = new Set([...new Set(ALL.map(q=>q.cat)), 'all', ...CHAPTERS.map(c=>'all_ch'+c.id), 'wrong_review', 'srs_review']);
  const result = {};
  try {
    Object.keys(localStorage).filter(k=>k.startsWith('wset_d1_prog_')).forEach(k=>{
      try {
        const v = JSON.parse(localStorage.getItem(k));
        if(v && v.cur < v.deckIds.length && validKeys.has(v.sessionKey)){
          result[v.sessionKey] = v;
        } else if(v && v.sessionKey && !validKeys.has(v.sessionKey)){
          localStorage.removeItem(k); // clean up stale keys
        }
      } catch(e){}
    });
  } catch(e){}
  return result;
}

// ---- 統計 ----
function getStats(){ return load('stats', {totalAnswered:0, totalCorrect:0, streak:0, lastDate:'', sessions:0}); }
function updateStats(correct){
  const s = getStats();
  s.totalAnswered++;
  if(correct) s.totalCorrect++;
  const today = new Date().toDateString();
  if(s.lastDate !== today){
    s.sessions++;
    s.lastDate=today;
    s.todayAnswered=0;
  }
  s.todayAnswered = (s.todayAnswered||0)+1;
  save('stats', s);
}
function updateStreak(correct){
  const s = getStats();
  if(correct){ s.streak = (s.streak||0)+1; }
  else { s.streak=0; }
  save('stats',s);
}

// ---- 連続学習日数 ----
function getDayStreak(){
  const log = load('daylog', []);
  const today = new Date().toDateString();
  if(!log.includes(today)){
    log.push(today);
    if(log.length>30) log.shift();
    save('daylog', log);
  }
  // count consecutive days backwards
  let streak=0;
  const d = new Date();
  for(let i=0;i<30;i++){
    if(log.includes(d.toDateString())) streak++;
    else break;
    d.setDate(d.getDate()-1);
  }
  return streak;
}

// =============================================
// SESSION START
// =============================================
function startDeckByCatIdx(ci){
  const qsInCh = chQs(curCh);
  const cats=[...new Set(qsInCh.map(q=>q.cat))];
  const cat=cats[ci];
  freshStart(qsInCh.filter(q=>q.cat===cat), cat);
}

function freshStart(qs, key){
  clearProgress(key);
  deck=shuffle(qs);
  cur=0; score=0; wrongIds=new Set();
  sessionKey = key||'custom';
  saveProgress();
  renderQ();
}

function startDeck(qs, key){
  freshStart(qs, key);
}

function resumeByKey(key){
  const prog = loadProgress(key);
  if(!prog){ showHome(); return; }
  deck = prog.deckIds.map(i=>ALL[i]).filter(Boolean);
  cur = prog.cur;
  score = prog.score;
  wrongIds = new Set(prog.wrongIds||[]);
  sessionKey = prog.sessionKey || key;
  renderQ();
}

function resumeSession(){
  // Called from hero card (resumes most recent session)
  const allProg = getAllProgress();
  const keys = Object.keys(allProg);
  if(!keys.length){ showHome(); return; }
  // Pick most recently saved
  const latest = keys.reduce((a,b)=>
    (allProg[a].savedAt||0) > (allProg[b].savedAt||0) ? a : b
  );
  resumeByKey(latest);
}

function startWrongReview(){
  const w = getWrongList();
  if(!w.length) return;
  const qs = w.map(i=>ALL[i]).filter(Boolean);
  startDeck(qs, 'wrong_review');
}

function startSRSReview(){
  const srs = getWrongLog();
  const now = Date.now();
  const dueIdxs = Object.keys(srs).map(Number).filter(i=>srs[i].due<=now);
  if(!dueIdxs.length) return;
  // Sort by most overdue first
  dueIdxs.sort((a,b)=>srs[a].due - srs[b].due);
  const qs = dueIdxs.map(i=>ALL[i]).filter(Boolean);
  startDeck(qs, 'srs_review');
}
