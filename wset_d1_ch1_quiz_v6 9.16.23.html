<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WSET D1 完全版問題集</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap');

:root{
  --bg:#f0f4ff;
  --bg2:#e8eeff;
  --surface:#ffffff;
  --surface2:#f5f7ff;
  --bd:#e2e8f0;
  --bd2:#b8c8f0;
  --primary:#1b2b5e;
  --ac:#2563eb;
  --ac-dark:#1d4ed8;
  --ac-light:#eff6ff;
  --ac2:#3b82f6;
  --dn:#ef4444;
  --ok:#22c55e;
  --ok-light:#f0fdf4;
  --dn-light:#fef2f2;
  --tx:#0f172a;
  --tx2:#64748b;
  --tx3:#94a3b8;
  --r:16px;
  --rs:12px;
  --shadow:0 2px 16px rgba(37,99,235,.08);
  --shadow-lg:0 8px 32px rgba(37,99,235,.15);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--tx);font-family:'Noto Sans JP',sans-serif;min-height:100vh}

/* ===== HEADER ===== */
.hdr{
  padding:14px 18px 14px;
  background:var(--surface);
  border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:10px;
  position:sticky;top:0;z-index:100;
  box-shadow:0 1px 8px rgba(37,99,235,.06);
}
.hdr-t{flex:1}
.hdr-t .sub{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);font-weight:600;font-family:'Plus Jakarta Sans',sans-serif}
.hdr-t .ttl{font-size:14px;font-weight:700;color:var(--tx)}
.hdr-sc .n{font-size:22px;font-weight:800;color:var(--ac);font-variant-numeric:tabular-nums;line-height:1;font-family:'Plus Jakarta Sans',sans-serif}
.hdr-sc .l{font-size:10px;color:var(--tx3);text-align:right}

/* Progress bar */
.prog-bg{height:3px;background:var(--bd)}
.prog-fg{height:3px;background:linear-gradient(90deg,var(--ac2),var(--ac));transition:width .4s ease}

/* ===== MAIN ===== */
.main{max-width:430px;margin:0 auto;padding:20px 16px 110px}

/* ===== HOME ===== */
.home-head{margin-bottom:20px}
.home-head h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:26px;font-weight:800;color:var(--tx);line-height:1.2;margin-bottom:4px}

/* PAGE HEAD (eyebrow + title + sub) */
.page-eyebrow{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ac);margin-bottom:6px;font-family:'Plus Jakarta Sans',sans-serif}
.page-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:28px;font-weight:800;color:var(--tx);line-height:1.2;margin-bottom:4px}
.page-sub{font-size:13px;color:var(--tx2);font-weight:600}

/* CHAPTER SELECT LIST */
.ch-list{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.ch-item{
  display:flex;align-items:center;gap:14px;
  background:var(--surface);border:1.5px solid var(--bd);
  border-radius:var(--r);padding:14px 16px;
  cursor:pointer;transition:all .2s ease;
  box-shadow:var(--shadow);
}
.ch-item:active{transform:scale(.98)}
.ch-item.active{border-color:var(--ac);background:var(--ac-light)}
.ch-item-num{
  flex-shrink:0;width:40px;height:40px;border-radius:12px;
  background:var(--ac-light);color:var(--ac);
  display:flex;align-items:center;justify-content:center;
  font-family:'Plus Jakarta Sans',sans-serif;font-size:16px;font-weight:800;
  transition:all .2s ease;
}
.ch-item.active .ch-item-num{background:var(--ac);color:#fff}
.ch-item-body{flex:1;min-width:0}
.ch-item-title{font-size:14px;font-weight:700;color:var(--tx);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-item-sub{font-size:12px;color:var(--tx2);margin-bottom:8px}
.ch-item-bar-bg{height:6px;background:var(--bd);border-radius:99px}
.ch-item-bar-fg{height:6px;background:var(--ac);border-radius:99px;transition:width .4s ease}
.ch-item-right{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.ch-item-pct{font-size:13px;font-weight:800;color:var(--ac);font-family:'Plus Jakarta Sans',sans-serif;font-variant-numeric:tabular-nums}
.ch-item-chevron{color:var(--tx-light,var(--tx3));display:flex;transition:color .2s ease}
.ch-item.active .ch-item-chevron{color:var(--ac)}

/* HERO CARD (今日の進捗) */
.hero-card{
  background:linear-gradient(135deg,var(--primary) 0%,var(--ac) 100%);
  border-radius:var(--r);
  padding:24px 20px 18px;
  margin-bottom:16px;
  position:relative;
  overflow:hidden;
  box-shadow:var(--shadow-lg);
}
.hero-label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.7);margin-bottom:6px}
.hero-score{font-family:'Plus Jakarta Sans',sans-serif;font-size:42px;font-weight:800;color:#fff;line-height:1;margin-bottom:2px}
.hero-score span{font-size:18px;font-weight:600;color:rgba(255,255,255,.6)}
.hero-bar-bg{height:6px;background:rgba(255,255,255,.25);border-radius:99px;margin:10px 0 8px}
.hero-bar-fg{height:6px;background:#fff;border-radius:99px;transition:width .6s ease}
.hero-pct{font-size:12px;color:rgba(255,255,255,.8);text-align:right;margin-top:-6px;margin-bottom:8px}
.hero-sub{font-size:12px;color:rgba(255,255,255,.75);display:flex;align-items:center;gap:6px;cursor:pointer}
.hero-sub .arrow{margin-left:auto;font-size:14px}

/* STAT BANNER */
.stat-banner{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.sb-item{background:var(--surface);border:1px solid var(--bd);border-radius:var(--rs);padding:10px 6px;text-align:center;box-shadow:var(--shadow)}
.sb-item .sb-v{font-size:19px;font-weight:800;color:var(--ac);line-height:1;font-family:'Plus Jakarta Sans',sans-serif}
.sb-item .sb-l{font-size:10px;color:var(--tx3);margin-top:3px}

/* SECTION LABEL */
.section-label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);margin-bottom:10px;margin-top:4px}

/* RESUME CARD */
.resume-card{
  background:linear-gradient(135deg,var(--primary),var(--ac));
  border-radius:var(--r);padding:16px 18px;
  margin-bottom:12px;
  box-shadow:var(--shadow-lg);
  cursor:pointer;
  transition:transform .15s;
}
.resume-card:active{transform:scale(.99)}
.rc-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rc-icon{font-size:20px}
.rc-title{font-size:14px;font-weight:700;color:#fff}
.rc-sub{font-size:12px;color:rgba(255,255,255,.75);margin-left:auto}
.rc-bar-bg{height:5px;background:rgba(255,255,255,.25);border-radius:99px;margin-bottom:12px}
.rc-bar-fg{height:5px;background:#fff;border-radius:99px;transition:width .4s}
.rc-btns{display:flex;gap:8px}
.rc-btn-p{flex:1;padding:10px;background:#fff;color:var(--ac);border:none;border-radius:var(--rs);font-size:14px;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:opacity .15s}
.rc-btn-p:active{opacity:.85}
.rc-btn-s{padding:10px 16px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:var(--rs);font-size:13px;cursor:pointer;font-family:'Noto Sans JP',sans-serif}

/* REVIEW CARD */
.review-card{
  display:flex;align-items:center;gap:12px;
  background:var(--surface);border:1px solid var(--bd);
  border-radius:var(--rs);padding:14px 16px;
  margin-bottom:10px;cursor:pointer;
  transition:all .15s;
  box-shadow:var(--shadow);
}
.review-card:hover{border-color:var(--ac2);transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.review-card:active{transform:scale(.99)}
.rv-icon{flex-shrink:0;width:42px;height:42px;background:var(--ac-light);border-radius:12px;display:flex;align-items:center;justify-content:center}
.rv-icon svg{width:22px;height:22px}
.rv-icon span{display:flex;align-items:center;justify-content:center}
.rv-body{flex:1}
.rv-title{font-size:14px;font-weight:700;color:var(--tx);margin-bottom:2px}
.rv-sub{font-size:12px;color:var(--tx2)}
.rv-arrow{font-size:18px;color:var(--ac)}

/* CAT LIST */
.cat-list{display:flex;flex-direction:column;gap:8px}
.cc{
  background:var(--surface);border:1px solid var(--bd);
  border-radius:var(--r);padding:14px 16px;
  cursor:pointer;display:flex;align-items:center;gap:12px;
  transition:all .15s;box-shadow:var(--shadow);
}
.cc:hover{border-color:var(--ac2);transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.cc:active{transform:scale(.99)}
.cc.all{background:var(--ac);border-color:var(--ac)}
.cc.all .cn{color:#fff}
.cc.all .cd{color:rgba(255,255,255,.75)}
.cc.all .ck{background:rgba(255,255,255,.2);color:#fff;border-color:transparent}
.cc.all .ttag{background:rgba(255,255,255,.15);color:rgba(255,255,255,.85);border-color:transparent}
.cc .ci{flex:1}
.cc .cn{font-size:15px;font-weight:700;color:var(--tx);margin-bottom:3px}
.cc .cd{font-size:12px;color:var(--tx2)}
.cc .ck{font-size:11px;color:var(--tx3);background:var(--surface2);border:1px solid var(--bd);padding:4px 12px;border-radius:99px;white-space:nowrap;font-weight:600}
.type-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.ttag{font-size:10px;padding:2px 8px;border-radius:99px;background:var(--ac-light);color:var(--ac);border:1px solid var(--bd)}

/* DUE DOT */
.due-dot{font-size:10px;background:#fef9c3;color:#854d0e;border:1px solid #fde047;border-radius:99px;padding:1px 7px;margin-left:6px;font-weight:600}

/* ===== QUESTION ===== */
.q-meta{display:flex;align-items:center;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.qbadge{font-size:11px;padding:3px 9px;border-radius:99px;font-weight:600;border:1px solid}
.qbadge.mc   {background:#eff6ff;color:#2563eb;border-color:#bfdbfe}
.qbadge.tf   {background:#fff7ed;color:#c2410c;border-color:#fed7aa}
.qbadge.fill {background:#faf5ff;color:#7c3aed;border-color:#e9d5ff}
.qbadge.order{background:#f0fdf4;color:#15803d;border-color:#bbf7d0}
.qbadge.multi{background:#fff1f2;color:#be123c;border-color:#fecdd3}
.qbadge.vocab{background:#f0f9ff;color:#0369a1;border-color:#bae6fd}
.qbadge.cat  {background:var(--surface2);color:var(--tx3);border-color:var(--bd)}
.q-num{font-size:12px;color:var(--tx3);margin-left:auto;font-variant-numeric:tabular-nums}
.q-text{font-size:17px;font-weight:700;line-height:1.75;margin-bottom:0;color:var(--tx)}
.q-text-en{
  font-size:13px;color:var(--tx3);line-height:1.65;
  margin:8px 0 18px;padding:9px 13px;
  background:var(--surface2);
  border-left:3px solid var(--ac2);
  border-radius:0 var(--rs) var(--rs) 0;
  font-style:italic;
}
.q-hint{font-size:12px;color:var(--tx3);margin-bottom:14px}

/* SRS BADGE */
.srs-badge{font-size:10px;background:var(--ac-light);color:var(--ac);border:1px solid var(--bd2);border-radius:99px;padding:2px 7px;font-weight:600}

/* OPTIONS */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  background:var(--surface);border:1.5px solid var(--bd);
  border-radius:var(--rs);padding:14px 16px;
  font-size:15px;color:var(--tx);cursor:pointer;
  text-align:left;transition:all .15s;line-height:1.5;
  width:100%;font-family:'Noto Sans JP',sans-serif;
  box-shadow:var(--shadow);
}
.opt:hover:not(:disabled){border-color:var(--ac2);background:var(--ac-light);transform:translateY(-1px)}
.opt:active{transform:scale(.99)}
.opt.correct{border-color:var(--ok)!important;background:var(--ok-light)!important;color:#14532d!important}
.opt.wrong  {border-color:var(--dn)!important;background:var(--dn-light)!important;color:#7f1d1d!important}
.opt.selected{border-color:var(--ac);background:var(--ac-light)}
.opt:disabled{cursor:default}
.vocab-opts .opt{text-align:center;font-size:16px;padding:16px}

/* T/F */
.tf-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tfb{
  padding:24px 8px;border-radius:var(--r);
  font-size:22px;font-weight:800;cursor:pointer;
  border:1.5px solid var(--bd);background:var(--surface);
  color:var(--tx);transition:all .15s;
  font-family:'Plus Jakarta Sans',sans-serif;width:100%;
  box-shadow:var(--shadow);
}
.tfb span{display:block;font-size:12px;font-weight:500;margin-top:5px;color:var(--tx2);font-family:'Noto Sans JP',sans-serif}
.tfb:hover:not(:disabled){border-color:var(--ac2);background:var(--ac-light);transform:translateY(-2px)}
.tfb:active{transform:scale(.97)}
.tfb.correct{border-color:var(--ok)!important;background:var(--ok-light)!important;color:#14532d!important}
.tfb.wrong  {border-color:var(--dn)!important;background:var(--dn-light)!important;color:#7f1d1d!important}
.tfb:disabled{cursor:default}

/* FILL */
.fill-inp{
  width:100%;background:var(--surface);
  border:1.5px solid var(--bd);border-radius:var(--rs);
  padding:14px 16px;font-size:16px;color:var(--tx);
  outline:none;font-family:'Noto Sans JP',sans-serif;
  transition:border-color .15s;-webkit-appearance:none;
  box-shadow:var(--shadow);
}
.fill-inp:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.fill-inp.correct{border-color:var(--ok);background:var(--ok-light)}
.fill-inp.wrong  {border-color:var(--dn);background:var(--dn-light)}
.sub-btn{
  margin-top:10px;padding:14px;width:100%;
  border-radius:var(--rs);border:1.5px solid var(--bd);
  background:var(--surface);color:var(--tx);
  font-size:15px;font-weight:700;cursor:pointer;
  font-family:'Noto Sans JP',sans-serif;transition:all .15s;
  box-shadow:var(--shadow);
}
.sub-btn:hover{border-color:var(--ac);color:var(--ac);background:var(--ac-light)}
.sub-btn:active{transform:scale(.99)}

/* ORDER */
.order-list{display:flex;flex-direction:column;gap:8px}
.oi{
  background:var(--surface);border:1.5px solid var(--bd);
  border-radius:var(--rs);padding:13px 15px;
  font-size:14px;color:var(--tx);cursor:pointer;
  display:flex;align-items:center;gap:10px;
  transition:all .15s;user-select:none;-webkit-user-select:none;
  box-shadow:var(--shadow);
}
.oi.tap-sel{border-color:var(--ac)!important;background:var(--ac-light)!important}
.oi.drag-ov{border-color:var(--ac2);background:var(--surface2)}
.oi .dh{color:var(--tx3);font-size:16px;flex-shrink:0}
.oi .on{font-size:12px;color:var(--ac);min-width:22px;font-variant-numeric:tabular-nums;font-weight:700}
.oi .ot{flex:1;line-height:1.45}

/* FEEDBACK */
.fb{border-radius:var(--r);padding:16px 16px;margin-top:14px;font-size:14px;line-height:1.8}
.fb.correct{background:var(--ok-light);border:1.5px solid #86efac;color:#14532d}
.fb.wrong  {background:var(--dn-light);border:1.5px solid #fca5a5;color:#7f1d1d}
.fb .fbl{font-weight:700;margin-bottom:6px;font-size:14px;display:flex;align-items:center;gap:6px}
.fb .ca{margin-top:10px;color:var(--tx);font-size:13px;border-top:1px solid rgba(0,0,0,.08);padding-top:10px}
.en{font-style:italic;color:var(--ac)}

/* NEXT BUTTON */
.next-wrap{position:fixed;bottom:0;left:0;right:0;padding:14px 18px 32px;background:linear-gradient(transparent,var(--bg) 35%);display:none}
.next-wrap.vis{display:block}
.next-btn{
  width:100%;max-width:430px;display:block;margin:0 auto;
  padding:16px;background:var(--ac);color:#fff;
  font-size:16px;font-weight:700;border:none;
  border-radius:var(--r);cursor:pointer;
  font-family:'Noto Sans JP',sans-serif;
  box-shadow:0 4px 20px rgba(37,99,235,.35);
  transition:all .15s;
}
.next-btn:hover{background:var(--ac-dark);transform:translateY(-1px)}
.next-btn:active{opacity:.9;transform:scale(.99)}

/* RESULT */
.res{text-align:center;padding:32px 16px}
.res h2{font-family:'Plus Jakarta Sans',sans-serif;font-size:28px;font-weight:800;color:var(--tx);margin-bottom:8px}
.res-sc{font-size:64px;font-weight:800;line-height:1;margin:20px 0 6px;font-variant-numeric:tabular-nums;font-family:'Plus Jakarta Sans',sans-serif;color:var(--ac)}
.res-sub{font-size:14px;color:var(--tx2);margin-bottom:24px}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.rs{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.rs .sv{font-size:24px;font-weight:800;color:var(--ac);font-family:'Plus Jakarta Sans',sans-serif}
.rs .sl{font-size:11px;color:var(--tx3);margin-top:3px}
.res-btns{display:flex;flex-direction:column;gap:10px}
.rb{padding:14px;border-radius:var(--rs);font-size:15px;font-weight:700;cursor:pointer;border:1.5px solid;font-family:'Noto Sans JP',sans-serif;transition:all .15s}
.rb:active{transform:scale(.99)}
.rb.p{background:var(--ac);color:#fff;border-color:var(--ac);box-shadow:0 4px 16px rgba(37,99,235,.3)}
.rb.s{background:var(--surface);color:var(--tx2);border-color:var(--bd)}
.rb.s:hover{border-color:var(--ac2);color:var(--ac)}

/* BACK */
.back{background:none;border:none;color:var(--tx3);font-size:13px;cursor:pointer;padding:0 0 20px;display:flex;align-items:center;gap:4px;font-family:'Noto Sans JP',sans-serif;font-weight:500}
.back:hover{color:var(--ac)}

/* STREAK POP */
.streak-pop{background:#fefce8;border:1.5px solid #fde047;border-radius:var(--rs);padding:10px 16px;text-align:center;font-size:14px;font-weight:700;color:#854d0e;margin-bottom:12px;animation:popIn .3s ease}
@keyframes popIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}

/* WRONG LIST */
.wrong-list-wrap{background:var(--dn-light);border:1.5px solid #fca5a5;border-radius:var(--rs);padding:14px 16px;margin-bottom:16px;text-align:left}
.wl-title{font-size:13px;font-weight:700;color:#7f1d1d;margin-bottom:8px}
.wl-item{font-size:12px;color:#7f1d1d;padding:5px 0;border-bottom:1px solid rgba(239,68,68,.12);line-height:1.5}
.wl-more{font-size:12px;color:#b91c1c;margin-top:4px}

/* VISUAL BLOCKS */
.vis-block{margin-top:12px;border-top:1px solid rgba(0,0,0,.06);padding-top:12px}
.vis-block svg{display:block;width:100%;height:auto;overflow:visible}
.mnemonic{margin-top:11px;border-top:1px solid rgba(0,0,0,.06);padding-top:10px;background:#fefce8;border-radius:var(--rs);padding:9px 12px;font-size:13px;color:#854d0e;border:1px solid #fde047}
.mnemonic .ml{font-weight:700;font-size:11px;letter-spacing:.05em;margin-bottom:4px;color:#713f12}
.img-credit{font-size:10px;color:var(--tx3);text-align:right;margin-top:3px}
.compare-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.compare-table th{background:var(--surface2);padding:7px 10px;text-align:left;font-weight:700;border:1px solid var(--bd);color:var(--tx)}
.compare-table td{padding:7px 10px;border:1px solid var(--bd);color:var(--tx);vertical-align:top}
.compare-table tr:nth-child(even) td{background:var(--bg2)}

/* STAT BANNER LEARNING SYSTEM */
.stat-banner{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.sb-item{background:var(--surface);border:1px solid var(--bd);border-radius:var(--rs);padding:10px 6px;text-align:center;box-shadow:var(--shadow)}
.sb-item .sb-v{font-size:19px;font-weight:800;color:var(--ac);line-height:1;font-family:'Plus Jakarta Sans',sans-serif}
.sb-item .sb-l{font-size:10px;color:var(--tx3);margin-top:3px}

/* QUESTION LIST */
.list-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.list-header h2{font-family:'Plus Jakarta Sans',sans-serif;font-size:18px;font-weight:800;flex:1;color:var(--tx)}
.list-search{width:100%;padding:11px 16px;border:1.5px solid var(--bd);border-radius:var(--rs);font-size:15px;font-family:'Noto Sans JP',sans-serif;background:var(--surface);color:var(--tx);outline:none;margin-bottom:12px;box-shadow:var(--shadow)}
.list-search:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.list-filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.lf-btn{font-size:11px;padding:5px 12px;border-radius:99px;border:1.5px solid var(--bd);background:var(--surface);color:var(--tx2);cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:all .15s;white-space:nowrap;font-weight:600}
.lf-btn.active{background:var(--ac);color:#fff;border-color:var(--ac)}
.lf-btn:active{transform:scale(.97)}
.list-count{font-size:12px;color:var(--tx3);margin-bottom:10px}
.q-list-item{background:var(--surface);border:1.5px solid var(--bd);border-radius:var(--rs);margin-bottom:8px;overflow:hidden;cursor:pointer;transition:all .15s;box-shadow:var(--shadow)}
.q-list-item:hover{border-color:var(--ac2);transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.qli-head{display:flex;align-items:flex-start;gap:10px;padding:13px 15px}
.qli-num{font-size:11px;color:var(--tx3);min-width:26px;padding-top:1px;font-variant-numeric:tabular-nums;font-weight:600}
.qli-body{flex:1;min-width:0}
.qli-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px}
.qli-q{font-size:14px;font-weight:500;color:var(--tx);line-height:1.55}
.qli-chevron{color:var(--tx3);font-size:16px;flex-shrink:0;transition:transform .2s;padding-top:2px}
.qli-chevron.open{transform:rotate(90deg)}
.qli-ans{display:none;padding:0 15px 14px 51px;background:var(--bg2);border-top:1px solid var(--bd)}
.qli-ans.open{display:block}
.qli-ans-label{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--tx3);margin-bottom:5px;margin-top:10px;text-transform:uppercase}
.qli-ans-val{font-size:13px;color:var(--ac);font-weight:700;line-height:1.6}
.qli-ans-opts{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.qli-opt{font-size:12px;color:var(--tx2);padding:3px 0;line-height:1.5}
.qli-opt.correct-opt{color:var(--ok);font-weight:700}

/* ANIMATIONS */
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fi{animation:fi .22s ease}

/* ===== NEW HEADER ===== */
.hdr{
  padding:0 18px;height:56px;
  background:var(--surface);
  border-bottom:1px solid var(--bd);
  display:flex;align-items:center;
  position:sticky;top:0;z-index:100;
  box-shadow:0 1px 8px rgba(37,99,235,.06);
}
.hdr-center{flex:1;text-align:center}
.hdr-right{flex-shrink:0;display:flex;align-items:center;justify-content:flex-end;gap:4px;min-width:24px}
.hdr-logo{font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:800;color:var(--tx);letter-spacing:-.01em;display:inline-block;transition:all .2s ease}
.hdr-logo:active{transform:scale(.96);opacity:.7}

/* ===== BOTTOM NAVBAR ===== */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  height:60px;background:var(--surface);
  border-top:1px solid var(--bd);
  display:flex;align-items:center;
  box-shadow:0 -2px 12px rgba(37,99,235,.06);
  z-index:200;
  padding-bottom:env(safe-area-inset-bottom);
}
.bn-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;cursor:pointer;padding:6px 0;
  font-size:10px;color:var(--tx3);font-weight:600;
  font-family:'Noto Sans JP',sans-serif;
  transition:color .15s;
  border:none;background:none;
}
.bn-item.active{color:var(--ac);box-shadow:inset 0 -2px 0 0 var(--ac)}
.bn-item .bn-icon{width:22px;height:22px;display:block;margin:0 auto 2px}

/* next-wrap must be above bottom-nav */
.next-wrap{z-index:199;padding-bottom:76px}
.main{padding-bottom:76px}

/* ===== CATEGORY GRID (2-column) ===== */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.cat-grid-full{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:10px}
.cg{
  background:var(--surface);border:1.5px solid var(--bd);
  border-radius:var(--r);padding:16px 14px 14px;
  cursor:pointer;transition:all .15s;
  box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:6px;
}
.cg:hover{border-color:var(--ac2);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.cg:active{transform:scale(.98)}
.cg.all{background:linear-gradient(135deg,var(--primary),var(--ac));border-color:transparent}
.cg.all .cg-name{color:#fff}
.cg.all .cg-count{color:rgba(255,255,255,.75)}
.cg.all .ttag{background:rgba(255,255,255,.18);color:#fff;border-color:transparent}
.cg.all .cg-icon{background:rgba(255,255,255,.2)}
.cg-icon{
  width:44px;height:44px;border-radius:12px;
  background:var(--ac-light);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:6px;
}
.cg-icon svg,.cg-icon span{width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.cg-icon span svg{width:22px;height:22px}
.cg-name{font-size:14px;font-weight:700;color:var(--tx);line-height:1.3}
.cg-count{font-size:12px;color:var(--tx3);font-weight:600}

/* SECTION TITLE */
.sec-title{font-size:13px;font-weight:700;color:var(--tx2);margin:16px 0 10px;letter-spacing:.02em}

/* HERO CARD tweaks */
.hero-card{cursor:pointer}
.hero-today-row{display:flex;align-items:baseline;gap:6px;margin-bottom:4px}
.hero-today-n{font-family:'Plus Jakarta Sans',sans-serif;font-size:52px;font-weight:800;color:#fff;line-height:1}
.hero-today-d{font-size:16px;color:rgba(255,255,255,.6);font-weight:600}

/* STATS GRID on home */
.stats-4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.s4-item{background:var(--surface);border:1px solid var(--bd);border-radius:var(--rs);padding:10px 4px;text-align:center;box-shadow:var(--shadow)}
.s4-v{font-size:18px;font-weight:800;color:var(--ac);font-family:'Plus Jakarta Sans',sans-serif;line-height:1}
.s4-l{font-size:9px;color:var(--tx3);margin-top:3px}

/* SVG Icon helpers */
.icon{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.icon svg{width:100%;height:100%}
.icon-16{width:16px;height:16px}
.icon-20{width:20px;height:20px}
.icon-22{width:22px;height:22px}
.icon-24{width:24px;height:24px}
.icon-28{width:28px;height:28px}
.icon-32{width:32px;height:32px}
.icon-40{width:40px;height:40px}


/* SESSION CARD (途中セッション) */
.session-card{
  background:var(--surface);border:1.5px solid var(--bd);
  border-radius:var(--r);padding:12px 14px;
  margin-bottom:8px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:10px;
}
.sc-left{flex:1;cursor:pointer;min-width:0}
.sc-left:hover .sc-label{color:var(--ac)}
.sc-label{font-size:14px;font-weight:700;color:var(--tx);margin-bottom:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-meta{font-size:11px;color:var(--tx3);margin-bottom:6px}
.sc-bar-bg{height:4px;background:var(--bd);border-radius:99px}
.sc-bar-fg{height:4px;background:var(--ac);border-radius:99px;transition:width .4s}
.sc-actions{display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.sc-btn-resume{
  padding:6px 12px;background:var(--ac);color:#fff;
  border:none;border-radius:var(--rs);font-size:12px;font-weight:700;
  cursor:pointer;font-family:'Noto Sans JP',sans-serif;white-space:nowrap;
}
.sc-btn-resume:active{opacity:.85}
.sc-btn-fresh{
  padding:5px 12px;background:transparent;color:var(--tx3);
  border:1px solid var(--bd);border-radius:var(--rs);font-size:11px;
  cursor:pointer;font-family:'Noto Sans JP',sans-serif;white-space:nowrap;
}
.sc-btn-fresh:hover{border-color:var(--dn);color:var(--dn)}

/* ---- CARD TAB BUTTONS ---- */
.cg-tab-resume{
  flex:1;padding:7px 0;background:var(--ac);color:#fff;
  border:none;border-radius:var(--rs);font-size:12px;font-weight:700;
  cursor:pointer;font-family:'Noto Sans JP',sans-serif;
}
.cg-tab-resume:active{opacity:.85}
.cg.all .cg-tab-resume{background:#fff;color:var(--ac)}
.cg.all .cg-tab-resume:active{opacity:.85}
.cg-tab-fresh{
  padding:7px 10px;background:transparent;color:var(--tx3);
  border:1px solid var(--bd);border-radius:var(--rs);font-size:11px;
  cursor:pointer;font-family:'Noto Sans JP',sans-serif;white-space:nowrap;
}
.cg-tab-fresh:hover{border-color:var(--dn);color:var(--dn)}
.cg.all .cg-tab-fresh{color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.3)}
.cg.all .cg-tab-fresh:hover{color:#fff;border-color:#fff}
.cg-tab-start{
  width:100%;padding:7px 0;background:transparent;color:var(--ac);
  border:1px solid var(--bd);border-radius:var(--rs);font-size:12px;font-weight:700;
  cursor:pointer;font-family:'Noto Sans JP',sans-serif;margin-top:4px;
}
.cg-tab-start:hover{background:var(--ac-light)}
.cg-tab-start:active{transform:scale(.99)}
.cg.all .cg-tab-start{color:#fff;border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.1)}
.cg.all .cg-tab-start:hover{background:rgba(255,255,255,.2)}

/* PAGE REFERENCE */
.page-ref{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;color:var(--ac);font-weight:600;
  background:var(--ac-light);border:1px solid #bfdbfe;
  border-radius:99px;padding:2px 10px;margin-top:10px;
}

/* SUMMARY PAGE */
.sum-card{background:var(--surface);border:1.5px solid var(--bd);border-radius:var(--r);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
.sum-head{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;transition:background .15s}
.sum-head:hover{background:var(--surface2)}
.sum-icon{width:36px;height:36px;background:var(--ac-light);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sum-title-area{flex:1;min-width:0}
.sum-title{font-size:14px;font-weight:700;color:var(--tx);margin-bottom:3px}
.sum-chev{font-size:18px;color:var(--tx3);transition:transform .2s;flex-shrink:0}
.sum-body{padding:0 16px 16px}
.sum-summary{font-size:13px;color:var(--tx2);line-height:1.75;padding:10px 0;border-bottom:1px solid var(--bd)}
.sum-points{margin-top:12px;background:var(--surface2);border-radius:var(--rs);padding:12px 14px}
.sum-points-title{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--tx3);margin-bottom:8px;text-transform:uppercase}
.sum-point{display:flex;align-items:flex-start;gap:7px;font-size:13px;color:var(--tx);padding:4px 0;line-height:1.55;border-bottom:1px solid var(--bd)}
.sum-point:last-child{border-bottom:none}
.sum-point span{flex:1}
.sum-quiz-btn{width:100%;margin-top:12px;padding:11px;background:var(--ac);color:#fff;border:none;border-radius:var(--rs);font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif;display:flex;align-items:center;justify-content:center;gap:6px}
.sum-quiz-btn:active{opacity:.85}

/* SUMMARY COMPONENTS */
.sm-section{padding-top:4px}
.sm-lead{font-size:13px;color:var(--tx);line-height:1.75;margin-bottom:12px;padding:10px 12px;background:var(--ac-light);border-radius:var(--rs);border-left:3px solid var(--ac)}
.sm-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.sm-box{border-radius:var(--rs);padding:12px;border:1px solid}
.sm-box-title{font-size:12px;font-weight:700;margin-bottom:6px}
.sm-blue{background:#eff6ff;border-color:#bfdbfe}.sm-blue .sm-box-title{color:#1d4ed8}
.sm-green{background:#f0fdf4;border-color:#86efac}.sm-green .sm-box-title{color:#15803d}
.sm-green2{background:#f0fdf4;border-color:#86efac}
.sm-amber{background:#fffbeb;border-color:#fde68a}.sm-amber .sm-box-title{color:#92400e}
.sm-brown{background:#fdf8f0;border-color:#d4a070}.sm-brown .sm-box-title{color:#7a5020}
.sm-earth{background:#f9f3eb;border-color:#c8a06a}.sm-earth .sm-box-title{color:#6b4423}
.sm-ul{margin:0;padding-left:16px;font-size:12px;color:var(--tx2);line-height:1.8}
.sm-flow{display:flex;flex-direction:column;gap:2px;margin:10px 0}
.sm-flow-item{border-radius:var(--rs);padding:9px 12px}
.sm-flow-arrow{text-align:center;font-size:16px;color:var(--tx3);line-height:1}
.sm-flow-label{font-size:13px;font-weight:700;color:var(--tx)}
.sm-flow-sub{font-size:11px;color:var(--tx2);margin-top:2px}
.sm-table-wrap{overflow-x:auto;margin:10px 0}
.sm-table{width:100%;border-collapse:collapse;font-size:12px}
.sm-table th{background:var(--ac-light);padding:7px 10px;text-align:left;font-weight:700;border:1px solid var(--bd);color:var(--ac);white-space:nowrap}
.sm-table td{padding:7px 10px;border:1px solid var(--bd);color:var(--tx);vertical-align:top;line-height:1.55}
.sm-table tr:nth-child(even) td{background:var(--surface2)}
.sm-key-facts{background:#fffbeb;border:1px solid #fde68a;border-radius:var(--rs);padding:12px 14px;margin-top:12px}
.sm-kf-title{font-size:11px;font-weight:700;color:#92400e;letter-spacing:.06em;margin-bottom:8px}

.sm-memo{background:#f0fdf4;border:1px solid #86efac;border-radius:var(--rs);padding:8px 12px;font-size:12px;color:#15803d;margin-top:8px}

function icon(name, size=20, color='currentColor'){
  const svg = ICONS[name];

}

  <!-- H2O out transpiration -->
  <text x="230" y="106" font-size="10" fill="#6090b0" font-weight="700">H₂O↑</text>
  <text x="230" y="117" font-size="8" fill="#6090b0">蒸散 Transpiration</text>
  <line x1="228" y1="110" x2="246" y2="110" stroke="#6090b0" stroke-width="1.5" marker-end="url(#a1)"/>
  <!-- stomata label bottom -->
  <text x="148" y="152" text-anchor="middle" font-size="8.5" fill="#3a7030" font-style="italic">↓ stomata（気孔）on the underside of leaves</text>
  <!-- equation box -->

{type:'vocab',cat:'用語（英語）',
 q:'「気孔」を英語で言うと？',en:'What is the English term for「気孔」?',
 opts:['Nodes','Stomata','Tendrils','Petioles'],ans:1,
 exp:`Stomata（気孔）＝葉の裏面にある小孔。CO₂の取り込みと水蒸気の放出を行う。<div class="vis-block"><svg viewBox="0 0 300 130" xmlns="http://www.w3.org/2000/svg" style="max-width:280px;display:block;margin:4px auto">
  <!-- normal -->
  <rect x="4" y="8" width="135" height="114" rx="7" fill="#edf7f1" stroke="#2c6e49" stroke-width="1"/>
  <text x="71" y="24" text-anchor="middle" font-size="9" font-weight="700" fill="#1a4a30">通常時 / Normal</text>
  <!-- guard cells open -->
  <ellipse cx="51" cy="60" rx="10" ry="24" fill="#60b050" stroke="#2a7030" stroke-width="1.5" transform="rotate(-10 51 60)"/>
  <ellipse cx="91" cy="60" rx="10" ry="24" fill="#60b050" stroke="#2a7030" stroke-width="1.5" transform="rotate(10 91 60)"/>
  <ellipse cx="71" cy="60" rx="9" ry="14" fill="white" stroke="#2a7030" stroke-width="1" opacity="0.8"/>
  <text x="71" y="63" text-anchor="middle" font-size="8" fill="#1a4a30">OPEN</text>
  <text x="71" y="83" text-anchor="middle" font-size="8" fill="#1a5fa0">← CO₂入る</text>
  <text x="71" y="95" text-anchor="middle" font-size="8" fill="#3a8050">光合成 ✓</text>
  <text x="71" y="107" text-anchor="middle" font-size="8" fill="#6090c0">蒸散→水輸送 ✓</text>
  <!-- water stress -->
  <rect x="162" y="8" width="134" height="114" rx="7" fill="#fdf6ed" stroke="#d09020" stroke-width="1"/>
  <text x="229" y="24" text-anchor="middle" font-size="9" font-weight="700" fill="#906010">水ストレス時</text>
  <!-- guard cells closed -->
  <ellipse cx="209" cy="60" rx="14" ry="22" fill="#c0a020" stroke="#907010" stroke-width="1.5" transform="rotate(-5 209 60)"/>
  <ellipse cx="249" cy="60" rx="14" ry="22" fill="#c0a020" stroke="#907010" stroke-width="1.5" transform="rotate(5 249 60)"/>
  <ellipse cx="229" cy="60" rx="3" ry="6" fill="#e8d060" stroke="#907010" stroke-width="1"/>
  <text x="229" y="63" text-anchor="middle" font-size="7" fill="#605010">CLOSED</text>
  <text x="229" y="83" text-anchor="middle" font-size="8" fill="#c04020">CO₂ ✗ 入らない</text>
  <text x="229" y="95" text-anchor="middle" font-size="8" fill="#c06010">光合成 ↓ 制限</text>
  <text x="229" y="107" text-anchor="middle" font-size="8" fill="#3a8050">水分保持 ✓</text>
</svg><div class="img-credit">▲ 気孔の開閉と影響</div></div><div class="page-ref">教科書 p.p.1 — Structure of the Shoots</div>`},

{type:'mc',cat:'樹の解剖',
 q:'複合芽（compound bud）が開くのはいつか？',en:'Compound buds form in one growing season and break open in ___.',
 opts:['形成された年の夏','翌年の春（展葉期）','2年後','秋の葉落ちと同時'],
 ans:1,exp:`Compound buds（複合芽＝latent buds）は翌年の春に展開してshoots（シュート）を生み出す。
<div class="vis-block"><table class="compare-table"><thead><tr><th></th><th>Compound bud（複合芽）</th><th>Prompt bud（プロンプト芽）</th></tr></thead>
<tbody>
<tr><td>別名</td><td>Latent bud（潜伏芽）</td><td>—</td></tr>
<tr><td>形成時期</td><td>ある生育期</td><td>ある生育期（同年）</td></tr>
<tr><td>開芽時期</td><td>翌年の春</td><td>同年の生育期内</td></tr>
<tr><td>産生するもの</td><td>主枝（primary shoots）</td><td>側枝（lateral shoots）</td></tr>
<tr><td>内部構造</td><td>一次芽＋二次・三次芽（予備）</td><td>—</td></tr>
</tbody></table></div>
<div class="mnemonic"><div class="ml">🧠 覚え方</div>「<b>Compound＝来年の計画、Prompt＝今すぐ！</b>」<br>複合芽は「来年開く」、プロンプト芽は「今年すぐ開く」。</div><div class="page-ref">教科書 p.2 — Buds</div>`},

{type:'mc',cat:'樹の解剖',
 q:'気孔（stomata）が閉じることの影響は？',en:'When stomata partially close due to water stress, this helps conserve water but limits ___ by preventing CO₂ from entering.',
 opts:['蒸散のみ促進される','光合成（photosynthesis）が制限される','タンニン合成が活発になる','根からの吸収が増す'],
 ans:1,exp:`気孔（stomata）が閉じるとCO₂の取り込みが妨げられてphotosynthesis（光合成）が制限される。水分は保持できるが成長が遅くなる。
<div class="vis-block"><svg viewBox="0 0 280 110" xmlns="http://www.w3.org/2000/svg" style="max-width:260px;display:block;margin:4px auto">
  <!-- normal state --><rect x="5" y="10" width="120" height="90" rx="6" fill="#edf7f1" stroke="#2c6e49" stroke-width="1"/>
  <text x="65" y="27" text-anchor="middle" font-size="9" font-weight="700" fill="#1a4a30">通常時 Normal</text>
  <rect x="45" y="35" width="40" height="16" rx="8" fill="#c8e8b0" stroke="#4a9040" stroke-width="1.5"/>
  <text x="65" y="46" text-anchor="middle" font-size="8" fill="#2a6020">気孔 OPEN</text>
  <text x="65" y="64" text-anchor="middle" font-size="8" fill="#1a5fa0">← CO₂入る</text>
  <text x="65" y="76" text-anchor="middle" font-size="8" fill="#3a8050">光合成✓</text>
  <text x="65" y="88" text-anchor="middle" font-size="8" fill="#6090c0">蒸散→輸送✓</text>
  <!-- water stress state --><rect x="155" y="10" width="120" height="90" rx="6" fill="#fdf6ed" stroke="#d4a030" stroke-width="1"/>
  <text x="215" y="27" text-anchor="middle" font-size="9" font-weight="700" fill="#a07010">水ストレス時</text>
  <rect x="185" y="35" width="60" height="16" rx="8" fill="#f5dca0" stroke="#c09020" stroke-width="1.5"/>
  <text x="215" y="46" text-anchor="middle" font-size="8" fill="#906010">気孔 CLOSED</text>
  <text x="215" y="64" text-anchor="middle" font-size="8" fill="#c04020">CO₂入らない✗</text>
  <text x="215" y="76" text-anchor="middle" font-size="8" fill="#c06010">光合成↓制限</text>
  <text x="215" y="88" text-anchor="middle" font-size="8" fill="#3a8050">水分保持✓</text>
</svg></div><div class="page-ref">教科書 p.3 — Leaves</div>`},
{type:'mc',cat:'樹の解剖',

{type:'mc',cat:'クローンと選抜',
 q:'クローン内多様性（diversity within clones）が生じる原因は？',en:'Diversity arises because at each ___ during plant growth there is the risk that random mutations occur.',
 opts:['接ぎ木のたびに','細胞分裂（cell division）のたびにランダムな突然変異が起こる','季節の変わり目に','台木との接触によって'],
 ans:1,exp:`挿し木・取り木で遺伝的に同一な個体が生まれるが、each cell division（細胞分裂のたびに）random mutations（ランダムな突然変異）が起こるリスクがある。<div class='mnemonic'><div class='ml'>🧠 覚え方</div>「コピーのコピーには微細な誤差が積み重なる」→ 細胞分裂のたびにランダムな突然変異が起こりうる。これがクローン内の多様性の源。</div><div class="page-ref">教科書 p.7 — Clones</div>`},
{type:'mc',cat:'クローンと選抜',
 q:'クローン選抜（clonal selection）の定義として正しいのは？',en:'Clonal selection is the process of selecting vines with particularly favourable characteristics and ___ by cuttings.',
 opts:['異なる品種を交配して新品種を作ること','望ましい特性を持つ樹を選んで挿し木で増殖すること','ウイルス検査を経ずに苗を増やすこと','複数の樹から無作為に採穂すること'],
 ans:1,exp:`Clonal selection（クローン選抜）＝特に優れた特性を持つ樹を選んで挿し木で増殖する技術。この40〜50年で普及した。<div class='mnemonic'><div class='ml'>🧠 覚え方</div>「良い樹を選んで挿し木でコピー」→ これがclonal selection（クローン選抜）。40〜50年前から普及。</div><div class="page-ref">教科書 p.7–8 — Clones</div>`},
{type:'mc',cat:'クローンと選抜',
 q:'Pinot Noir Clone 115とClone 521の違いは？',en:'Clone 115 has low yields of small grapes suited to red wine; Clone 521 has higher yields of bigger grapes suited to ___.',
 opts:['115赤ワイン向き・小粒高収量 / 521スパークリング向き・大粒低収量','115赤ワイン向き・小粒低収量 / 521スパークリング向き・大粒高収量','両者に差はない','115スパークリング向き / 521赤ワイン向き'],
 ans:1,exp:`Clone 115＝low yields / small grapes（低収量・小粒）→高品質赤ワイン向き。Clone 521＝higher yields / bigger grapes（高収量・大粒）→スパークリング向き。

<tbody>
<tr><td>収量</td><td>低 low yield</td><td>高 higher yield</td></tr>
<tr><td>粒の大きさ</td><td>小 small grapes</td><td>大 bigger grapes</td></tr>
<tr><td>タンニン・色素</td><td>豊富 ✓</td><td>薄い（不要）</td></tr>
<tr><td>用途</td><td>高品質赤ワイン<br>high quality red</td><td>スパークリング<br>sparkling wine</td></tr>
</tbody></table></div>
<div class="mnemonic"><div class="ml">🧠 覚え方</div>「<b>115＝イチイチゴ（苺）＝小粒で濃い赤</b>」→ 赤ワイン向き。「<b>521＝コシャン（大盛り）</b>」→ 高収量・大粒でスパークリング向き。</div><div class="page-ref">教科書 p.7 — Clones</div>`},

{type:'mc',cat:'新品種の作出',
 q:'「クロス（cross）」と「ハイブリッド（hybrid）」の違いは？',en:'A cross results from two parent vines of the ___ species; a hybrid from two ___ species.',
 opts:['crossは異種間・hybridは同種間','crossは同種間（same species）・hybridは異種間（different species）','どちらも同じ','crossは自然交配・hybridは人工交配'],
 ans:1,exp:`Cross（クロス）＝same species（同一種内）交配。Hybrid（ハイブリッド）＝different species（異種間）交配。
<div class="vis-block"><table class="compare-table"><thead><tr><th></th><th>Cross（クロス）</th><th>Hybrid（ハイブリッド）</th></tr></thead>
<tbody>
<tr><td>定義</td><td>同一種内 same species</td><td>異種間 different species</td></tr>
<tr><td>例</td><td>Pinotage<br><small>Pinot Noir × Cinsaut<br>（どちらもV. vinifera）</small></td><td>Vidal Blanc<br><small>Ugni Blanc (V. vinifera)<br>× Seibel系（北米種）</small></td></tr>
<tr><td>別例</td><td>Cab. Sauv.<br><small>Sauv. Blanc × Cab. Franc</small></td><td>Müller-Thurgauは<br><small>同種なのでcross</small></td></tr>
</tbody></table></div>
<div class="mnemonic"><div class="ml">🧠 覚え方</div>「<b>Cross＝仲間内の結婚、Hybrid＝国際結婚</b>」同じV. vinifera同士ならcross、異なる種をまたぐとhybrid。</div><div class="page-ref">教科書 p.8–9 — New Grape Varieties</div>`},
{type:'mc',cat:'新品種の作出',
 q:'Pinotageの交配親は？',en:'Pinotage is a cross of Pinot Noir and ___.',
 opts:['Chardonnay','Cinsaut','Merlot','Grenache'],
 ans:1,exp:`PinotageはPinot Noir × Cinsautのcross（クロス）。南アフリカ原産。どちらもV. vinifera種内なのでcrossと分類される。
<div class="mnemonic"><div class="ml">🧠 語呂合わせ</div>「<b>ピノタージュ＝ピノ＋エルミタージュ（Cinsautの別名）</b>」→ 名前の中に答えが入っている！</div><div class="page-ref">教科書 p.9 — New Grape Varieties</div>`},

{type:'mc',cat:'新品種の作出',
 q:'Müller-Thurgauの作出目標と現実の結果は？',en:'Müller-Thurgau was created to have the fruit quality of Riesling and the high yield of Madeleine Royale, but in reality it has not achieved ___.',
 opts:['高収量','Rieslingに匹敵する品質（quality potential）','病害耐性','広い栽培地域'],
 ans:1,exp:`Müller-Thurgau＝Riesling × Madeleine Royale。目標はRieslingのquality＋Madeleine Royaleのyieldだったが、実際にはRieslingのquality potentialには達しなかった。
<div class="vis-block"><table class="compare-table"><thead><tr><th></th><th>目標 Goal</th><th>現実 Reality</th></tr></thead>
<tbody>
<tr><td>品質</td><td>Riesling並み ✓（目標）</td><td>Riesling未満 ✗</td></tr>
<tr><td>収量</td><td>Madeleine Royale並みの高収量 ✓</td><td>高収量は達成 ✓</td></tr>
<tr><td>結論</td><td colspan="2">高収量品種としては有用だが、高品質ワインへの適性はRieslingに及ばない</td></tr>
</tbody></table></div>
<div class="mnemonic"><div class="ml">🧠 覚え方</div>「<b>ミュラー・トゥルガウ＝収量は○、品質は△</b>」→ 試験では「Rieslingの品質には達しなかった」という事実が問われる。</div><div class="page-ref">教科書 p.9 — New Grape Varieties</div>`},
{type:'mc',cat:'新品種の作出',
 q:'ハイブリッド品種が台木として重視される理由は？',en:'Hybrids are useful as rootstocks because of their resistance to ___, pests and climatic extremes.',

{type:'mc',cat:'新品種の作出',
 q:'新品種が市場に出にくい主な原因は？',en:'New grape varieties rarely come to market; the main reason is ___ resistance.',
 opts:['厳しい法的規制','高い生産コスト','消費者（consumer）の抵抗','ウイルス感染のリスク'],
 ans:2,exp:`Consumer resistance（消費者の抵抗）＝消費者は見知らぬ新品種よりも既知品種を好む傾向がある。これが新品種の市場投入の主な障壁。<div class='mnemonic'><div class='ml'>🧠 試験頻出</div>"The main reason is <b>consumer resistance</b>" → 法的規制でも品質問題でもなく消費者の抵抗が主因！</div><div class="page-ref">教科書 p.9 — New Grape Varieties</div>`},
{type:'mc',cat:'新品種の作出',
 q:'遺伝マーカー（genetic markers）の利点は？',en:'Genetic markers allow scientists to select offspring with desired characteristics without having to ___, speeding up breeding programmes.',
 opts:['品種を安く大量生産できる','樹を育てて果実を確認する前に望む特性の個体を選べる','病害を完全に除去できる','台木が不要になる'],
 ans:1,exp:`Genetic markers（遺伝マーカー）により実際にwait for the vine to grow and bear fruit（果実を確認するまで待つ）ことなく望ましい特性の個体を選べる。育種プログラムが大幅に加速。<div class='mnemonic'><div class='ml'>🧠 ポイント</div>遺伝マーカー＝「DNA上の目印」。実際に果実が実るのを待たずに望ましい特性の個体を早期選別できる → 育種プログラムが大幅に加速。</div><div class="page-ref">教科書 p.9 — New Grape Varieties</div>`},
{type:'mc',cat:'新品種の作出',
 q:'新品種を商業流通させるために必要なことは？',en:'To make a new variety available commercially, it needs to be registered on the ___ catalogue.',
 opts:['EU農業委員会への申請','OIV（国際ブドウ・ワイン機構）カタログへの登録','地元当局の許可のみ','10年以上の栽培実績'],
 ans:1,exp:`OIV（Organisation Internationale de la Vigne et du Vin）カタログへの登録が必要。<div class='mnemonic'><div class='ml'>🧠 覚え方</div>OIV = Organisation <b>I</b>nternationale de la <b>V</b>igne et du Vin。「国際ブドウ・ワイン機構」。新品種商業化に登録必須。</div><div class="page-ref">教科書 p.9 — New Grape Varieties</div>`},
{type:'mc',cat:'新品種の作出',
 q:'Vidal Blancの交配親は？',en:'Vidal Blanc is a hybrid from Ugni Blanc (V. vinifera) and a member of the ___ family.',
 opts:['Riesling系','Seibel系（北米系統）','Pinot系','Müller-Thurgau系'],
 ans:1,exp:`Vidal BlancはUgni Blanc（V. vinifera）× Seibel系（北米系統American parentage）のhybrid（ハイブリッド）。アイスワインに多く使われる。<div class='vis-block'><table class='compare-table'><thead><tr><th>親品種A</th><th>親品種B</th><th>子孫</th><th>分類</th></tr></thead><tbody><tr><td>Ugni Blanc (V. vinifera)</td><td>Seibel系（北米種）</td><td>Vidal Blanc</td><td>Hybrid（異種間）</td></tr><tr><td>Pinot Noir (V. vinifera)</td><td>Cinsaut (V. vinifera)</td><td>Pinotage</td><td>Cross（同種間）</td></tr></tbody></table></div><div class="page-ref">教科書 p.9 — New Grape Varieties</div>`},
// --- 試験対策：応用・統合 ---
{type:'mc',cat:'試験対策：応用',
 q:'機械収穫（machine harvesting）の場合、lateral shootの二次果房（second crop）はどのような影響を与えるか？',en:'When machine harvested, the second crop cannot be separated and may therefore have an impact on the ___ and finished wine.',
 opts:['二次果房は自動的に除去される','二次果房が混入しmust（果汁）と完成ワインの品質に影響する','収量のみが変化する','色素量が増える'],
 ans:1,exp:`手摘みでは選択的収穫や分離が可能だが、machine harvested（機械収穫）では二次果房を分離できない。二次果房は高酸・低糖・未熟タンニン・色素不足で、must（果汁）と完成ワインの品質に影響する。
<div class="vis-block"><table class="compare-table"><thead><tr><th>二次果房（second crop）の特性</th><th>影響</th></tr></thead>
<tbody>
<tr><td>酸度 high acidity</td><td>ワインの過剰な酸味</td></tr>
<tr><td>糖分 low sugar</td><td>アルコール低下</td></tr>
<tr><td>タンニン unripe tannins</td><td>青臭い・渋い</td></tr>
<tr><td>色素 less colour（黒ブドウ）</td><td>色が薄い</td></tr>
</tbody></table>
<div style="margin-top:7px;font-size:12px;color:#555">対処法：手摘み→選別/分離 ✓ / グリーンハーベストで事前除去 ✓ / 機械収穫→分離不可 ✗</div></div><div class="page-ref">教科書 p.p.2–3 — Lateral Shoots</div>`},

{type:'mc',cat:'試験対策：応用',
 q:'取り木（layering）が「常に適切とは言えない（not always suitable）」理由として教科書が挙げるのは？',en:'Layering is not always suitable because the new vine has no protection against ___ and lacks the qualities that a choice of rootstocks offers.',
 opts:['ウイルス','フィロキセラ（phylloxera）と台木の利点（desired yield等）がない','真菌病','気候的変動'],
 ans:1,exp:'取り木で育った樹は①no protection against phylloxera（フィロキセラ耐性がない）②台木が提供するdesired yield（望ましい収量）などの利点がない、という問題がある。<div class="page-ref">教科書 p.6–7 — Vine Propagation</div>'},
{type:'mc',cat:'試験対策：応用',
 q:'マスセレクションをクローン選抜と比較したとき、どちらが圃場の多様性を高めるか？',en:'Compared to clonal selection, mass selection ___ the diversity of planting material in the vineyard.',
 opts:['多様性を下げる','多様性を高める（increases diversity）','多様性に変化をもたらさない','多様性の影響は台木の種類による'],
 ans:1,exp:`Mass selection（マスセレクション）はincreases diversity（多様性を高める）。Clonal selection（クローン選抜）は均一性が高まるが多様性は失われやすい。
<div class="vis-block"><table class="compare-table"><thead><tr><th></th><th>Clonal Selection<br>クローン選抜</th><th>Mass Selection<br>マスセレクション</th></tr></thead>
<tbody>
<tr><td>多様性</td><td>低い ✗</td><td>高い ✓</td></tr>
<tr><td>均一性</td><td>高い ✓</td><td>低い</td></tr>
<tr><td>管理容易性</td><td>容易（同時に熟す）</td><td>複雑</td></tr>

{type:'mc',cat:'試験対策：応用',
 q:'ブドウの樹が「woodland climber（森林のつる性植物）」であることが栽培上どのような意味を持つか？',en:'In the wild, vines grow quickly towards sunlight at the top of the woodland canopy. The grape grower must therefore manipulate the vine to produce grapes with adequate ___ for wine.',
 opts:['環境適応力が高く管理不要','栽培者が介入しなければ良質なワイン用ブドウを結実させない（ripeness of sugar/acids/tannins/aromas）','根が非常に浅い','種子繁殖のみで増殖する'],

{type:'mc',cat:'試験対策：応用',
 q:'北米種（North American vine species）の主なグローバルな役割は？',en:'North American vine species are used in some regions for wine production, but their main function globally is as ___ onto which V. vinifera is grafted.',
 opts:['主要なワイン用品種として','台木（rootstocks）として','新品種作出のハイブリッド素材として','科学研究の実験材料として'],
 ans:1,exp:`北米種のmain function globally（世界的な主な役割）はrootstocks（台木）としてV. viniferaを接ぎ木すること。

<tr><td><i>Vitis berlandieri</i></td><td>台木（石灰質土壌耐性）</td></tr>

{type:'multi',cat:'試験対策：応用',
