  }else if(q.type==='order'){
    orderItems=[...q.items];
    h+=`<div class="q-hint">※タップして選択→タップして移動（またはドラッグ）</div>
    <div class="order-list" id="ol">${orderItems.map((it,i)=>`<div class="oi" draggable="true" data-i="${i}"
      ondragstart="odS(event,${i})" ondragover="odO(event,${i})" ondrop="odD(event,${i})" onclick="odT(${i})">
      <span class="dh">⋮⋮</span><span class="on">${i+1}</span><span class="ot">${it}</span>
    </div>`).join('')}</div>
    <button class="sub-btn" onclick="doOrder()">順番を確認 / Check order →</button>`;
  }else if(q.type==='multi'){
    h+=`<div class="q-hint">※正しいものをすべて選択 / Select all that apply</div>
    <div class="opts" id="opts">${q.opts.map((o,i)=>`<button class="opt" id="mo${i}" onclick="doToggle(${i})">${o}</button>`).join('')}</div>
    <button class="sub-btn" onclick="doMulti()">答え合わせ / Check →</button>`;
  }
  h+=`<div id="fb"></div></div>`;
  document.getElementById('main').innerHTML=h;
  document.getElementById('hsc').textContent=score;
  if(q.type==='fill')setTimeout(()=>{const el=document.getElementById('fi');if(el)el.focus()},80);
}

function backToHome(){
  if(cur < deck.length) saveProgress();  // only save if session incomplete
  else clearProgress(sessionKey);         // clear if finished
  document.getElementById('hsc').style.display='none';
  showHome();
}

// =============================================
// FEEDBACK + RECORD
// =============================================
function showFb(ok, exp, cans){
  answered=true;
  if(ok) score++;
  document.getElementById('hsc').textContent=score;

  // Record to storage
  const q=deck[cur];
  const qIdx=ALL.indexOf(q);
  if(qIdx >= 0) updateSRS(qIdx, ok);
  updateStats(ok);
  updateStreak(ok);
  if(!ok){
    wrongIds.add(qIdx);
    addToWrong(qIdx);
  } else {
    // 3回連続正解で復習リストから削除
    const srs=getWrongLog()[qIdx];
    if(srs && srs.reps>=3) removeFromWrong(qIdx);
  }

  // Save progress
  saveProgress();

  // Streak flash
  const stats=getStats();
  const streakFlash = ok && stats.streak>0 && stats.streak%5===0
    ? `<div class="streak-pop">${icon('flame',16,'#f97316')} ${stats.streak}問連続正解！</div>` : '';

  let h=`${streakFlash}<div class="fb ${ok?'correct':'wrong'}">
    <div class="fbl">${ok?`<span style="width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;color:var(--ok);vertical-align:middle;flex-shrink:0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="9 12 11.5 14.5 16 9.5"/></svg></span> 正解 / Correct！`:`<span style="width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;color:var(--dn);vertical-align:middle;flex-shrink:0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg></span> 不正解 / Incorrect`}</div>${exp}`;
  if(!ok&&cans)h+=`<div class="ca"><span style="width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;color:var(--ok);vertical-align:middle;flex-shrink:0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="9 12 11.5 14.5 16 9.5"/></svg></span> 正解 / Answer：${cans}</div>`;
  h+=`</div>`;
  document.getElementById('fb').innerHTML=h;
  document.getElementById('nw').classList.add('vis');
  document.getElementById('nb').textContent=cur+1<deck.length?'次の問題 →':'結果を見る →';
  setTimeout(()=>document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'}),80);
}

function doMC(i){
  if(answered)return;
  const q=deck[cur];
  document.querySelectorAll('#opts .opt').forEach(b=>b.disabled=true);
  document.querySelectorAll('#opts .opt')[i].classList.add(i===q.ans?'correct':'wrong');
  if(i!==q.ans)document.querySelectorAll('#opts .opt')[q.ans].classList.add('correct');
  showFb(i===q.ans,q.exp,null);
}
function doTF(v){
  if(answered)return;
  const q=deck[cur];
  document.querySelectorAll('.tfb').forEach(b=>b.disabled=true);
  document.querySelectorAll('.tfb').forEach((b,i)=>{
    const bv=i===0;
    if(bv===q.ans)b.classList.add('correct');
    else if(bv===v&&v!==q.ans)b.classList.add('wrong');
  });
  showFb(v===q.ans,q.exp,q.ans?'正しい / True':'誤り / False');
}
function doFill(){
  if(answered)return;
  const q=deck[cur];const inp=document.getElementById('fi');
  if(!inp||!inp.value.trim())return;
  const v=inp.value.trim().toLowerCase();
  const alts=(q.alt||[]).map(a=>a.toLowerCase());

  let ok;
  if(q.req && q.req.length>0){
    // 複数必須: req の全キーワードが入力に含まれているか
    const reqs=q.req.map(r=>r.toLowerCase());
    const missing=reqs.filter(r=>!v.includes(r));
    ok = missing.length===0;
    if(!ok){
      // 部分正解フィードバック
      inp.classList.add('wrong');inp.disabled=true;
      document.querySelector('.sub-btn').style.display='none';
      const missStr = q.req.filter((_,i)=>!v.includes(reqs[i])).join('、');
      showFb(false, q.exp + `<div class="ca" style="color:#c0392b;display:flex;align-items:flex-start;gap:6px"><span style="width:15px;height:15px;display:inline-flex;align-items:center;justify-content:center;color:#c0392b;vertical-align:middle;flex-shrink:0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><circle cx="12" cy="16" r="0.5" fill="currentColor"/></svg></span><span>足りないキーワード：<b>${missStr}</b></span></div>`, q.ans);
      return;
    }
  } else {
    // 単答: alt のどれかが含まれていればOK
    ok=alts.some(a=>v.includes(a)||a.includes(v));
  }

  inp.classList.add(ok?'correct':'wrong');inp.disabled=true;
  document.querySelector('.sub-btn').style.display='none';
  showFb(ok,q.exp,q.ans);
}
function doToggle(i){
  if(answered)return;
  const idx=selMulti.indexOf(i);
  if(idx===-1){selMulti.push(i);document.getElementById('mo'+i).classList.add('selected');}
  else{selMulti.splice(idx,1);document.getElementById('mo'+i).classList.remove('selected');}
}
function doMulti(){
  if(answered)return;
  const q=deck[cur];
  const ss=[...selMulti].sort(),as=[...q.ans].sort();
  const ok=JSON.stringify(ss)===JSON.stringify(as);
  document.querySelectorAll('#opts .opt').forEach((b,i)=>{
    b.disabled=true;
    if(q.ans.includes(i))b.classList.add('correct');
    else if(selMulti.includes(i))b.classList.add('wrong');
  });
  document.querySelector('.sub-btn').style.display='none';
  showFb(ok,q.exp,q.opts.filter((_,i)=>q.ans.includes(i)).join('、'));
}
function odS(e,i){dragIdx=i;e.currentTarget.classList.add('dragging')}
function odO(e,i){e.preventDefault();document.querySelectorAll('.oi').forEach(el=>el.classList.remove('drag-ov'));e.currentTarget.classList.add('drag-ov')}
function odD(e,i){
  e.preventDefault();
  document.querySelectorAll('.oi').forEach(el=>{el.classList.remove('drag-ov');el.classList.remove('dragging')});
  if(dragIdx===i)return;
  const tmp=orderItems[dragIdx];orderItems.splice(dragIdx,1);orderItems.splice(i,0,tmp);
  rebuildOL();dragIdx=-1;
}
function odT(i){
  if(answered)return;
  const items=document.querySelectorAll('.oi');
  if(tapSel===-1){tapSel=i;items[i].classList.add('tap-sel');}
  else{
    const tmp=orderItems[tapSel];orderItems.splice(tapSel,1);orderItems.splice(i,0,tmp);
    tapSel=-1;rebuildOL();
  }
}
function rebuildOL(){
  const ol=document.getElementById('ol');if(!ol)return;
  ol.innerHTML=orderItems.map((it,i)=>`<div class="oi" draggable="true" data-i="${i}"
    ondragstart="odS(event,${i})" ondragover="odO(event,${i})" ondrop="odD(event,${i})" onclick="odT(${i})">
    <span class="dh">⋮⋮</span><span class="on">${i+1}</span><span class="ot">${it}</span>
  </div>`).join('');
}
function doOrder(){
  if(answered)return;
  const q=deck[cur];
  const ok=JSON.stringify(orderItems)===JSON.stringify(q.ans.map(i=>q.items[i]));
  document.querySelector('.sub-btn').style.display='none';
  showFb(ok,q.exp,q.ans.map((i,n)=>`${n+1}. ${q.items[i]}`).join('<br>'));
}
function nextQ(){cur++;renderQ();}

// =============================================
// RESULT
// =============================================
function showResult(){
  document.getElementById('nw').classList.remove('vis');
  document.getElementById('prog').style.width='100%';
  clearProgress();
  const total=deck.length, pct=Math.round(score/total*100);
  const wrongArr=[...wrongIds];
  const msg=pct>=90?'完璧！':pct>=70?'よくできました！':pct>=50?'もう少し！':'復習しよう';

  // XP-style reward
  const xp = score*10 + (pct>=90?50:pct>=70?20:0);

  let h=`<div class="res fi">
    <h2>${msg}</h2>
    <div class="res-sc">${score}<span style="font-size:28px;color:var(--tx3)">/${total}</span></div>
    <div class="res-sub">正答率 ${pct}% &nbsp;·&nbsp; +${xp}XP</div>
    <div class="res-grid">
      <div class="rs"><div class="sv">${score}</div><div class="sl">正解数</div></div>
      <div class="rs"><div class="sv">${total-score}</div><div class="sl">不正解数</div></div>
      <div class="rs"><div class="sv">${pct}%</div><div class="sl">正答率</div></div>
      <div class="rs"><div class="sv">${getDayStreak()}</div><div class="sl"><span style="width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;color:#fb923c;vertical-align:middle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c0 6-6 8-6 14a6 6 0 0012 0c0-6-6-8-6-14z"/><path d="M12 12c0 3-2 4-2 6a2 2 0 004 0c0-2-2-3-2-6z"/></svg></span>連続日数</div></div>
    </div>`;

  // 不正解リスト
  if(wrongArr.length>0){
    h+=`<div class="wrong-list-wrap">
      <div class="wl-title"><span style="width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;color:#7f1d1d;vertical-align:middle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg></span> 今回の不正解（${wrongArr.length}問）</div>
      <div class="wl-body">`;
    wrongArr.slice(0,8).forEach(idx=>{
      const q=ALL[idx];
      if(q) h+=`<div class="wl-item">${q.q.replace(/\n.*/,'').slice(0,55)}…</div>`;
    });
    if(wrongArr.length>8) h+=`<div class="wl-more">他${wrongArr.length-8}問…</div>`;
    h+=`</div></div>`;
  }

  h+=`<div class="res-btns">`;
  if(wrongArr.length>0){
    h+=`<button class="rb p" onclick="startWrongReview()"style="display:flex;align-items:center;justify-content:center;gap:8px"><span style="width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;color:#fff;vertical-align:middle;flex-shrink:0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg></span> 不正解を復習する（${wrongArr.length}問）</button>`;
  }
  h+=`<button class="rb ${wrongArr.length>0?'s':'p'}" onclick="startDeck(chQs(curCh),'all_ch'+curCh)">全問もう一度</button>
    <button class="rb s" onclick="showHome()">ホームに戻る</button>
  </div></div>`;

  document.getElementById('main').innerHTML=h;
}

// Init
// Startup cleanup: remove stale progress keys from old sessions
(function cleanStaleProgress(){
  try {
    const validKeys = new Set([...new Set(ALL.map(q=>q.cat)), 'all', ...CHAPTERS.map(c=>'all_ch'+c.id), 'wrong_review', 'srs_review']);
    Object.keys(localStorage)
      .filter(k => k.startsWith('wset_d1_prog_'))
      .forEach(k => {
        try {
          const v = JSON.parse(localStorage.getItem(k));
          if(!v || !validKeys.has(v.sessionKey)) localStorage.removeItem(k);
        } catch(e){ localStorage.removeItem(k); }
      });
  } catch(e){}
})();
getDayStreak(); // record today's visit
showStartPage();

</script>
